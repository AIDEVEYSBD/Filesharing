  --steel-soft: #e8eff6;
  --slate: #5b6673;
  --slate-soft: #eceff2;
  --warm: #8f8577;
  --warm-soft: #f1eee9;
  --emerald: #1f8458;
  --emerald-soft: #e6f3ec;
  --amber: #b4781f;
  --amber-soft: #f8efe0;
  --font: "Inter", "SF Pro Text", -apple-system, "Segoe UI", system-ui, sans-serif;
  --ease: cubic-bezier(.2, .7, .2, 1);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-feature-settings: "cv11", "ss01";
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* ---- stage ---------------------------------------------------------------- */
.stage {
  position: absolute; left: 50%; top: 50%;
  width: 1920px; height: 1080px; overflow: hidden;
  transform: translate(-50%, -50%);
  transform-origin: center;
  opacity: 0; transition: opacity .5s var(--ease);
}
body.ready .stage { opacity: 1; }
.slides, .slide { width: 100%; height: 100%; }
.slide {
  position: absolute; inset: 0;
  padding: 18px 32px 18px;
  display: grid;
  grid-template-rows: 62px 1fr 60px;
  grid-template-columns: 1fr;
  opacity: 0; visibility: hidden; pointer-events: none;
  transition: opacity .55s var(--ease), transform .55s var(--ease), visibility 0s linear .55s;
}
.slide.is-before { transform: translateX(-48px); }
.slide.is-after  { transform: translateX(48px); }
.slide.is-active { opacity: 1; visibility: visible; pointer-events: auto; transform: none; transition-delay: 0s; }

/* ---- typography helpers --------------------------------------------------- */
.eyebrow {
  display: inline-flex; align-items: center; gap: 10px;
  font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3);
}
.eyebrow-dash { width: 18px; height: 2px; background: var(--accent); border-radius: 1px; }

/* ---- header ---------------------------------------------------------------- */
.hdr {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: end;
  padding-bottom: 14px; border-bottom: 1px solid var(--line);
}
.hdr-brand { display: flex; align-items: center; gap: 14px; padding-bottom: 4px; }
.brand-logo { height: 22px; width: auto; display: block; }
.brand-sep { width: 1px; height: 18px; background: var(--line); }
.brand-text { font-size: 13px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.hdr-title { text-align: center; }
.hdr-title h1 { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -.015em; line-height: 1.1; }
.hdr-title p  { margin: 4px 0 0; font-size: 14px; font-weight: 500; letter-spacing: .02em; color: var(--ink-3); }
.hdr-meta { display: flex; justify-content: flex-end; align-items: baseline; gap: 12px; padding-bottom: 4px; }
.meta-label { font-size: 12px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.page-num { font-size: 16px; font-weight: 500; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.page-num b { font-weight: 600; color: var(--ink); }
.page-num i { font-style: normal; margin: 0 5px; color: var(--ink-4); }

/* ---- problem band ----------------------------------------------------------- */
.problem {
  display: grid; grid-template-columns: 840px 1fr; column-gap: 56px; align-items: center;
  padding: 18px 0 14px; border-bottom: 1px solid var(--line);
}
.problem-lead .statement {
  margin: 8px 0 0; font-size: 26px; line-height: 1.25; font-weight: 500; letter-spacing: -.012em; color: var(--ink);
  text-wrap: balance;
}
.problem-lead .direction { margin: 8px 0 0; font-size: 13px; line-height: 1.4; color: var(--ink-3); }
.issues { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); column-gap: 24px; }
.issue { display: grid; grid-template-columns: auto 1fr; column-gap: 14px; align-items: start; padding-left: 20px; border-left: 1px solid var(--line); }
.issue-num { font-size: 13px; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; padding-top: 3px; letter-spacing: .04em; }
.issue h3 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.005em; line-height: 1.3; }
.issue p  { margin: 5px 0 0; font-size: 13px; line-height: 1.45; color: var(--ink-2); }

/* ---- architecture ---------------------------------------------------------- */
.arch-wrap { display: grid; grid-template-rows: 26px 1fr; min-height: 0; }
.arch-head { display: flex; align-items: center; justify-content: space-between; padding-top: 8px; }
.arch-flow { font-size: 12px; font-weight: 500; letter-spacing: .02em; color: var(--ink-3); }
.arch-flow i { font-style: normal; color: var(--ink-4); margin: 0 8px; }
.arch-canvas { position: relative; width: 1856px; height: 100%; min-height: 0; }
.arch { display: block; width: 100%; height: 100%; overflow: visible; font-family: var(--font); }

/* lanes */
.lane rect { fill: var(--lane); stroke: var(--line-soft); stroke-width: 1; transition: fill .4s var(--ease), stroke .4s var(--ease); }
.lane.active rect { fill: #ffffff; stroke: #d2d5da; }
.lane-num { font-size: 13px; font-weight: 700; fill: var(--accent); letter-spacing: .06em; }
.lane-title { font-size: 13px; font-weight: 600; fill: var(--ink-2); letter-spacing: .1em; text-transform: uppercase; }
.lane-rule { stroke: var(--line-soft); stroke-width: 1; }
.lane-desc { font-size: 11.5px; font-weight: 400; fill: var(--ink-3); }
.lane.active .lane-title { fill: var(--ink); }

/* nodes */
.node { cursor: pointer; outline: none; transition: opacity .45s var(--ease); }
.node-body { transform-box: fill-box; transform-origin: center; transition: transform .45s var(--ease); }
.node-bg { fill: var(--surface); stroke: #d7dade; stroke-width: 1; filter: url(#node-shadow); transition: stroke .35s var(--ease); }
.node-ring { fill: none; stroke: var(--accent); stroke-width: 1.5; opacity: 0; transition: opacity .35s var(--ease); }
.node.kind-agent .node-bg { stroke: #c9cfd6; }
.node.kind-external .node-bg { stroke-dasharray: 5 4; stroke: #c4bdb3; }
.node.kind-external.active .node-bg { stroke-dasharray: none; stroke: var(--steel); }
.agent-dot { fill: var(--slate); opacity: .7; }
.chip-bg { fill: var(--slate-soft); transition: fill .35s var(--ease); }
.ico { stroke: var(--slate); transition: stroke .35s var(--ease); }
.kind-external .chip-bg { fill: var(--warm-soft); } .kind-external .ico { stroke: var(--warm); }
.kind-data .chip-bg,
.kind-infra .chip-bg,
.kind-input .chip-bg { fill: var(--steel-soft); }
.kind-data .ico, .kind-infra .ico, .kind-input .ico { stroke: var(--steel); }
.kind-human .chip-bg { fill: var(--accent-soft); } .kind-human .ico { stroke: var(--accent); }
.kind-ok .chip-bg { fill: var(--emerald-soft); } .kind-ok .ico { stroke: var(--emerald); }
.kind-deny .chip-bg { fill: var(--amber-soft); } .kind-deny .ico { stroke: var(--amber); }
.node-eyebrow { font-size: 10px; font-weight: 600; fill: var(--ink-3); letter-spacing: .08em; text-transform: uppercase; }
.node-title { font-size: 15px; font-weight: 600; fill: var(--ink); letter-spacing: -.005em; }
.node.kind-ok .node-eyebrow { fill: var(--emerald); }
.node.kind-deny .node-eyebrow { fill: var(--amber); }
.node.kind-human .node-eyebrow { fill: var(--accent); }

/* node states while tracing */
.arch.playing .node { opacity: .38; }
.arch.playing .node.visited, .arch.playing .node.alt { opacity: 1; }
.arch.playing .node.active { opacity: 1; }
.arch.playing .node.active .node-body { transform: scale(1.04); }
.node.active .node-bg { stroke: var(--ink); filter: url(#node-shadow-active); }
.node.active .node-ring { opacity: 1; }
.node.kind-ok.active .node-ring { stroke: var(--emerald); }
.node.kind-deny.active .node-ring { stroke: var(--amber); }
.node.kind-human.active .node-ring { stroke: var(--accent); }
.node.kind-agent.active .node-ring { stroke: var(--ink); }
.node.kind-external.active .node-ring, .node.kind-data.active .node-ring, .node.kind-input.active .node-ring, .node.kind-infra.active .node-ring { stroke: var(--steel); }
.node.active .chip-bg { fill: var(--ink); } .node.active .ico { stroke: #fff; }
.node.kind-ok.active .chip-bg { fill: var(--emerald); }
.node.kind-deny.active .chip-bg { fill: var(--amber); }
.node.kind-human.active .chip-bg { fill: var(--accent); }
.node.visited .node-bg { stroke: #b9bec6; }
.node.alt .node-bg { stroke-dasharray: 4 3; }
.node.kind-ok.alt .node-bg { stroke: var(--emerald); }
.node.kind-deny.alt .node-bg { stroke: var(--amber); }
.node.pinned .node-ring { opacity: 1; stroke: var(--steel); }

/* hover-relationship focus */
.arch.focus .node:not(.related) { opacity: .25; }
.arch.focus .edge:not(.related) { opacity: .18; }
.arch.focus .edge.related .edge-base { stroke-width: 2; }
.arch.focus .edge.related.edge-flow .edge-base { stroke: var(--ink); }
.arch.focus .edge.related.edge-integration .edge-base, .arch.focus .edge.related.edge-enrich .edge-base { stroke: var(--steel); }
.arch.focus .edge.related.edge-human .edge-base { stroke: var(--accent); }
.arch.focus .edge.related.edge-ok .edge-base { stroke: var(--emerald); }
.arch.focus .edge.related.edge-deny .edge-base { stroke: var(--amber); }
.arch.focus .edge.related.edge-feedback .edge-base { stroke: var(--warm); }
.arch.focus .edge.related.edge-flow .edge-base { marker-end: url(#m-flow-hi); }
.arch.focus .edge.related.edge-integration .edge-base { marker-end: url(#m-integration-hi); }
.arch.focus .edge.related.edge-integration.bi .edge-base { marker-start: url(#m-integration-hi-rev); }
.arch.focus .edge.related.edge-enrich .edge-base { marker-end: url(#m-enrich-hi); }
.arch.focus .edge.related.edge-human .edge-base { marker-end: url(#m-human-hi); }
.arch.focus .edge.related.edge-human.bi .edge-base { marker-start: url(#m-human-hi-rev); }
.arch.focus .edge.related.edge-ok .edge-base { marker-end: url(#m-ok-hi); }
.arch.focus .edge.related.edge-deny .edge-base { marker-end: url(#m-deny-hi); }
.arch.focus .edge.related.edge-feedback .edge-base { marker-end: url(#m-feedback-hi); }

/* edges */
.edge { transition: opacity .45s var(--ease); }
.edge-base { fill: none; stroke-width: 1.5; stroke-linecap: round; transition: stroke .3s var(--ease), stroke-width .3s var(--ease); }
.edge-hi { fill: none; stroke-width: 2.25; stroke-linecap: round; opacity: 0; }
.edge.tracing .edge-hi, .edge.traced .edge-hi { opacity: 1; }
.edge.alt .edge-hi { stroke-dasharray: 5 4 !important; stroke-dashoffset: 0 !important; }
.signal { opacity: 0; }
.arch.playing .edge:not(.traced):not(.tracing) { opacity: .4; }

.edge-flow .edge-base { stroke: #a9aeb6; marker-end: url(#m-flow); }
.edge-flow .edge-hi { stroke: var(--ink); } .edge-flow .signal { fill: var(--ink); }
.edge-integration .edge-base { stroke: #9fb8d0; marker-end: url(#m-integration); }
.edge-integration.bi .edge-base { marker-start: url(#m-integration-rev); }
.edge-integration .edge-hi { stroke: var(--steel); } .edge-integration .signal { fill: var(--steel); }
.edge-enrich .edge-base { stroke: #9fb8d0; stroke-dasharray: 2 5; stroke-width: 2; marker-end: url(#m-enrich); }
.edge-enrich .edge-hi { stroke: var(--steel); stroke-dasharray: 2 5; } .edge-enrich .signal { fill: var(--steel); }
.edge-human .edge-base { stroke: #e3a3a8; stroke-dasharray: 6 4; marker-end: url(#m-human); }
.edge-human.bi .edge-base { marker-start: url(#m-human-rev); }
.edge-human .edge-hi { stroke: var(--accent); } .edge-human .signal { fill: var(--accent); }
.edge-ok .edge-base { stroke: #a3cdb7; marker-end: url(#m-ok); }
.edge-ok .edge-hi { stroke: var(--emerald); } .edge-ok .signal { fill: var(--emerald); }
.edge-deny .edge-base { stroke: #dcc08f; marker-end: url(#m-deny); }
.edge-deny .edge-hi { stroke: var(--amber); } .edge-deny .signal { fill: var(--amber); }
.edge-feedback .edge-base { stroke: #c6bdb2; stroke-dasharray: 9 6; marker-end: url(#m-feedback); }
.edge-feedback .edge-hi { stroke: var(--warm); } .edge-feedback .signal { fill: var(--warm); }

/* highlight arrowheads appear once the path has fully drawn */
.edge-flow .edge-hi.drawn { marker-end: url(#m-flow-hi); }
.edge-integration .edge-hi.drawn { marker-end: url(#m-integration-hi); }
.edge-integration.bi .edge-hi.drawn { marker-start: url(#m-integration-hi-rev); }
.edge-enrich .edge-hi.drawn { marker-end: url(#m-enrich-hi); }
.edge-human .edge-hi.drawn { marker-end: url(#m-human-hi); }
.edge-human.bi .edge-hi.drawn { marker-start: url(#m-human-hi-rev); }
.edge-ok .edge-hi.drawn { marker-end: url(#m-ok-hi); }
.edge-deny .edge-hi.drawn { marker-end: url(#m-deny-hi); }
.edge-feedback .edge-hi.drawn { marker-end: url(#m-feedback-hi); }

/* markers */
.mk path { stroke: none; }
.mk-flow path { fill: #a9aeb6; } .mk-flow-hi path { fill: var(--ink); }
.mk-integration path { fill: #9fb8d0; } .mk-integration-hi path { fill: var(--steel); }
.mk-enrich path { fill: #9fb8d0; } .mk-enrich-hi path { fill: var(--steel); }
.mk-human path { fill: #e3a3a8; } .mk-human-hi path { fill: var(--accent); }
.mk-ok path { fill: #a3cdb7; } .mk-ok-hi path { fill: var(--emerald); }
.mk-deny path { fill: #dcc08f; } .mk-deny-hi path { fill: var(--amber); }
.mk-feedback path { fill: #c6bdb2; } .mk-feedback-hi path { fill: var(--warm); }

/* labels & annotations */
.edge-label { font-size: 11px; font-weight: 500; fill: var(--ink-3); letter-spacing: .01em; paint-order: stroke; stroke: var(--lane); stroke-width: 5px; stroke-linejoin: round; }
.edge.traced .edge-label, .edge.tracing .edge-label { fill: var(--ink-2); }
.annot-either rect { fill: #fff; stroke: var(--line); }
.annot-text { font-size: 10.5px; font-weight: 600; fill: var(--ink-3); letter-spacing: .08em; text-transform: uppercase; }
.legend-title { font-size: 10.5px; font-weight: 600; fill: var(--ink-3); letter-spacing: .1em; text-transform: uppercase; }
.legend-text { font-size: 11.5px; font-weight: 500; fill: var(--ink-2); }
.legend-line { stroke-width: 1.75; }
.arch.playing .legend .edge:not(.traced) { opacity: 1; }

/* ---- control bar ----------------------------------------------------------- */
.bar {
  display: grid; grid-template-columns: auto auto 1fr auto; align-items: center; column-gap: 28px;
  margin-top: 6px; padding: 0 6px 0 2px; height: 60px;
  border-top: 1px solid var(--line);
}
.bar-stages { display: flex; gap: 6px; }
.stage-pill {
  display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px 0 10px;
  border: 1px solid transparent; border-radius: 15px; background: transparent; color: var(--ink-3);
  font: inherit; font-size: 11.5px; font-weight: 500; letter-spacing: .02em; cursor: pointer;
  transition: all .3s var(--ease);
}
.stage-pill b { font-weight: 700; font-size: 11px; color: var(--ink-4); letter-spacing: .04em; }
.stage-pill:hover { background: #ececea; color: var(--ink); }
.stage-pill.done { color: var(--ink-2); } .stage-pill.done b { color: var(--ink-2); }
.stage-pill.active { background: var(--ink); color: #fff; border-color: var(--ink); }
.stage-pill.active b { color: #ff8a90; }

.bar-controls { display: flex; align-items: center; gap: 6px; }
.ctl {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 38px; min-width: 38px; padding: 0 10px; border-radius: 19px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
  transition: all .25s var(--ease);
}
.ctl:hover { border-color: #b9bec6; }
.ctl:active { transform: translateY(1px); }
.ctl:disabled { opacity: .35; cursor: default; }
.ctl-sm { height: 34px; min-width: 34px; padding: 0 8px; }
.ctl-gap { width: 6px; }
.ui-ico { width: 18px; height: 18px; }
.ctl-play { background: var(--accent); border-color: var(--accent); color: #fff; padding: 0 18px 0 14px; }
.ctl-play:hover { background: #c01e27; border-color: #c01e27; }
.bar.is-playing .ctl-play { background: var(--ink); border-color: var(--ink); }

.bar-caption { min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 2px; border-left: 1px solid var(--line); padding-left: 24px; height: 52px; }
.cap-head { display: flex; align-items: baseline; gap: 12px; }
.cap-step { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); font-variant-numeric: tabular-nums; }
.cap-title { font-size: 14px; font-weight: 600; color: var(--ink); }
.cap-text { margin: 0; font-size: 13px; line-height: 1.3; color: var(--ink-2); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.bar-tools { display: flex; gap: 6px; }

/* ---- inspector popover ------------------------------------------------------- */
.inspector {
  position: absolute; z-index: 5; width: 360px; padding: 16px 18px 14px;
  background: #fff; border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 18px 40px rgba(27, 30, 35, .14), 0 2px 6px rgba(27, 30, 35, .06);
  pointer-events: none;
  animation: pop-in .22s var(--ease);
}
@keyframes pop-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.inspector::before {
  content: ""; position: absolute; left: var(--arrow-x, 50%); top: -7px; width: 12px; height: 12px; margin-left: -6px;
  background: #fff; border-left: 1px solid var(--line); border-top: 1px solid var(--line); transform: rotate(45deg);
}
.inspector.above::before { top: auto; bottom: -7px; transform: rotate(225deg); }
.insp-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.insp-kind { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--slate); padding: 3px 8px; border-radius: 4px; background: var(--slate-soft); }
.insp-kind.kind-external { color: var(--warm); background: var(--warm-soft); }
.insp-kind.kind-data, .insp-kind.kind-input, .insp-kind.kind-infra { color: var(--steel); background: var(--steel-soft); }
.insp-kind.kind-human { color: var(--accent); background: var(--accent-soft); }
.insp-kind.kind-ok { color: var(--emerald); background: var(--emerald-soft); }
.insp-kind.kind-deny { color: var(--amber); background: var(--amber-soft); }
.insp-stage { font-size: 11px; font-weight: 500; color: var(--ink-3); letter-spacing: .02em; }
.inspector h3 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
.inspector p { margin: 6px 0 0; font-size: 13px; line-height: 1.5; color: var(--ink-2); }
.insp-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line-soft); }
.insp-cols h4 { margin: 0 0 6px; font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.insp-cols ul { list-style: none; margin: 0; padding: 0; }
.insp-cols li { font-size: 12.5px; font-weight: 500; color: var(--ink); display: flex; align-items: center; gap: 8px; padding: 2px 0; }
.insp-cols li.none { color: var(--ink-4); }
.insp-cols li small { color: var(--steel); font-size: 12px; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--ink); }
.dot-integration, .dot-enrich { background: var(--steel); }
.dot-human { background: var(--accent); }
.dot-ok { background: var(--emerald); }
.dot-deny { background: var(--amber); }
.dot-feedback { background: var(--warm); }

/* ---- help overlay ------------------------------------------------------------ */
.help { position: absolute; inset: 0; z-index: 10; background: rgba(244, 244, 242, .72); display: flex; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
.help-card { width: 460px; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 22px 26px 20px; box-shadow: 0 24px 60px rgba(27, 30, 35, .18); }
.help-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.help-head h2 { margin: 0; font-size: 18px; font-weight: 600; }
.help dl { display: grid; grid-template-columns: 120px 1fr; row-gap: 8px; column-gap: 16px; margin: 0; font-size: 13.5px; }
.help dt { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.help dd { margin: 0; color: var(--ink-2); }
.help-toggle { display: flex; align-items: center; gap: 10px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line-soft); font-size: 13.5px; font-weight: 500; }
.help-toggle small { color: var(--ink-3); font-weight: 400; }

/* ---- reduced motion ---------------------------------------------------------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
}
html.reduced-motion *, html.reduced-motion *::before, html.reduced-motion *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
html.reduced-motion .arch.playing .node.active .node-body { transform: none; }

.empty { padding: 40px; color: var(--ink-3); }

/* hidden attribute must win over display rules */
[hidden] { display: none !important; }

/* ============================================================================
   Multi-page additions: header nav, cover, workflow, Project 02 node kinds
   ========================================================================== */
.brand-logo { height: 22px; width: auto; display: block; }
.hdr-meta { gap: 10px; align-items: center; }
.nav-btn { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); cursor: pointer; padding: 0; transition: all .25s var(--ease); }
.nav-btn:hover { border-color: #b9bec6; color: var(--ink); }
.nav-btn .ui-ico { width: 15px; height: 15px; }
.hdr-title { min-height: 48px; }

/* stream style (enterprise data) */
.edge-stream .edge-base { stroke: #9fb8d0; marker-end: url(#m-stream); }
.edge-stream .edge-hi { stroke: var(--steel); } .edge-stream .signal { fill: var(--steel); }
.edge-stream .edge-hi.drawn { marker-end: url(#m-stream-hi); }
.mk-stream path { fill: #9fb8d0; } .mk-stream-hi path { fill: var(--steel); }
.arch.focus .edge.related.edge-stream .edge-base { stroke: var(--steel); marker-end: url(#m-stream-hi); }
.dot-stream { background: var(--steel); }

/* node kinds: product (logo), proposed, process */
.kind-product .chip-bg { fill: #fff; stroke: var(--line-soft); }
.node.kind-product.active .chip-bg { fill: #fff; stroke: var(--line); }
.node.kind-product .node-eyebrow { fill: var(--ink-3); }
.node.kind-proposed .node-bg { stroke-dasharray: 5 4; stroke: #9fb8d0; }
.node.kind-proposed.active .node-bg { stroke-dasharray: none; stroke: var(--steel); }
.kind-proposed .chip-bg { fill: var(--steel-soft); } .kind-proposed .ico { stroke: var(--steel); }
.node.kind-proposed .node-eyebrow { fill: var(--steel); }
.node.kind-proposed.active .chip-bg { fill: var(--steel); }
.node.kind-proposed.active .node-ring, .node.kind-process.active .node-ring { stroke: var(--steel); }
.kind-process .chip-bg { fill: var(--slate-soft); } .kind-process .ico { stroke: var(--slate); }
.insp-kind.kind-product { color: var(--ink-2); background: #f0f0ee; }
.insp-kind.kind-proposed { color: var(--steel); background: var(--steel-soft); }
.lane-note { font-size: 11px; font-weight: 500; fill: var(--ink-3); }

/* control bar on static pages */
.bar-static { grid-template-columns: 1fr auto; }
.bar-stages:empty { display: none; }
.bar-hint { font-size: 13px; color: var(--ink-3); }
.bar-hint b { font-weight: 600; color: var(--ink-2); padding: 1px 6px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); }

/* ---- cover page ----------------------------------------------------------- */
.cover { display: grid; grid-template-columns: 620px 1fr; column-gap: 96px; align-items: center; padding: 0 0 24px; min-height: 0; }
.cover-title { margin: 22px 0 0; font-size: 58px; line-height: 1.04; font-weight: 600; letter-spacing: -.025em; text-wrap: balance; }
.cover-sub { margin: 18px 0 0; font-size: 19px; font-weight: 500; color: var(--ink-3); letter-spacing: -.005em; line-height: 1.35; }
.cover-direction { margin: 40px 0 0; padding-top: 22px; border-top: 1px solid var(--line); font-size: 14px; line-height: 1.5; color: var(--ink-2); }
.cover-statement { margin: 14px 0 0; font-size: 34px; line-height: 1.2; font-weight: 500; letter-spacing: -.018em; text-wrap: balance; }
.cover-support { margin: 16px 0 0; font-size: 16px; line-height: 1.5; color: var(--ink-2); max-width: 960px; }
.metrics { list-style: none; margin: 34px 0 0; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); column-gap: 24px; }
.metric { display: flex; flex-direction: column; gap: 4px; padding: 0 0 0 18px; border-left: 2px solid var(--accent); }
.metric b { font-size: 40px; line-height: 1; font-weight: 600; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.metric span { font-size: 13px; font-weight: 500; color: var(--ink-2); margin-top: 6px; }
.metric small { font-size: 11.5px; color: var(--ink-3); }
.cover-issues { margin-top: 36px; padding-top: 30px; border-top: 1px solid var(--line); }
.cover-issues.cols-3 { grid-template-columns: repeat(3, 1fr); }
.cover-issues.cols-4 { grid-template-columns: repeat(4, 1fr); column-gap: 20px; }
.cover-issues .issue { padding-left: 0; border-left: 0; }
.cover-issues .issue h3 { font-size: 15.5px; }
.cover-issues .issue p { font-size: 13px; }
/* entrance */
.slide-cover .rise { opacity: 0; transform: translateY(14px); transition: opacity .7s var(--ease), transform .7s var(--ease); transition-delay: calc(.05s + var(--i, 0) * .045s); }
.slide-cover.entered .rise { opacity: 1; transform: none; }

/* ---- workflow page -------------------------------------------------------- */
.wf { display: grid; grid-template-rows: auto 1fr; min-height: 0; padding-top: 10px; }
.wf-head h2 { margin: 10px 0 0; font-size: 26px; font-weight: 600; letter-spacing: -.015em; }
.wf-cols { display: grid; column-gap: 20px; margin-top: 22px; min-height: 0; align-items: start; }
.wf-cols.cols-4 { grid-template-columns: repeat(4, 1fr); }
.wf-cols.cols-5 { grid-template-columns: repeat(5, 1fr); }
.wf-col { background: var(--lane); border: 1px solid var(--line-soft); border-radius: 12px; padding: 18px 18px 10px; height: 100%; transition: background .4s var(--ease), border-color .4s var(--ease); }
.wf-col.active { background: #fff; border-color: #d2d5da; }
.wf-col-head { display: flex; align-items: baseline; gap: 10px; padding-bottom: 12px; margin-bottom: 8px; border-bottom: 1px solid var(--line-soft); font-size: 13px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.wf-col-head b { color: var(--accent); font-weight: 700; letter-spacing: .06em; }
.wf-list { list-style: none; margin: 0; padding: 0; }
.wf-step { display: grid; grid-template-columns: 30px 1fr; column-gap: 12px; padding: 14px 12px 14px 12px; margin: 0 -6px; border-radius: 10px; border: 1px solid transparent; cursor: pointer; transition: opacity .45s var(--ease), transform .45s var(--ease), background .45s var(--ease), border-color .45s var(--ease), box-shadow .45s var(--ease); }
.wf-step + .wf-step { margin-top: 2px; }
.wf-num { font-size: 12px; font-weight: 700; color: var(--ink-4); font-variant-numeric: tabular-nums; letter-spacing: .04em; padding-top: 3px; }
.wf-step h4 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.005em; line-height: 1.3; }
.wf-step p { margin: 5px 0 0; font-size: 13px; line-height: 1.45; color: var(--ink-2); }
.wf-step:hover { background: #fff; border-color: var(--line); }
.wf.playing .wf-step.pending { opacity: .32; }
.wf.playing .wf-step.done .wf-num { color: var(--emerald); }
.wf.playing .wf-step.active { background: #fff; border-color: var(--ink); box-shadow: 0 10px 28px rgba(27, 30, 35, .10); transform: translateY(-1px); }
.wf.playing .wf-step.active .wf-num { color: var(--accent); }
html.reduced-motion .wf.playing .wf-step.active { transform: none; }

</style>

/* =============================================================================
   Architecture renderer — builds the SVG diagram from a slide definition.
   Exposes a small API used by the trace engine and the inspector.
   ========================================================================== */
(function (global) {
  'use strict';

  const SVG_NS = 'http://www.w3.org/2000/svg';
  const STYLE_KEYS = ['flow', 'integration', 'enrich', 'human', 'ok', 'deny', 'feedback', 'stream'];
  const ARROW_LEN = 10;

  function el(name, attrs, children) {
    const n = document.createElementNS(SVG_NS, name);
    if (attrs) for (const k in attrs) if (attrs[k] != null) n.setAttribute(k, attrs[k]);
    if (children) for (const c of children) if (c) n.appendChild(c);
    return n;
  }
  const text = (x, y, str, cls, attrs) => {
    const t = el('text', Object.assign({ x, y, class: cls }, attrs || {}));
    t.textContent = str;
    return t;
  };

  /* --- geometry ---------------------------------------------------------- */
  const center = n => ({ x: n.x + n.w / 2, y: n.y + n.h / 2 });

  function anchor(n, side, d) {
    d = d || 0;
    switch (side) {
      case 'left':   return { x: n.x,        y: n.y + n.h / 2 + d };
      case 'right':  return { x: n.x + n.w,  y: n.y + n.h / 2 + d };
      case 'top':    return { x: n.x + n.w / 2 + d, y: n.y };
      case 'bottom': return { x: n.x + n.w / 2 + d, y: n.y + n.h };
    }
  }

  function roundedPolyline(pts, r) {
    let d = `M${pts[0].x} ${pts[0].y}`;
    for (let i = 1; i < pts.length - 1; i++) {
      const p0 = pts[i - 1], p1 = pts[i], p2 = pts[i + 1];
      const v1 = { x: p1.x - p0.x, y: p1.y - p0.y };
      const v2 = { x: p2.x - p1.x, y: p2.y - p1.y };
      const l1 = Math.hypot(v1.x, v1.y), l2 = Math.hypot(v2.x, v2.y);
      const rr = Math.min(r, l1 / 2, l2 / 2);
      const a = { x: p1.x - v1.x / l1 * rr, y: p1.y - v1.y / l1 * rr };
      const b = { x: p1.x + v2.x / l2 * rr, y: p1.y + v2.y / l2 * rr };
      d += ` L${a.x} ${a.y} Q${p1.x} ${p1.y} ${b.x} ${b.y}`;
    }
    const last = pts[pts.length - 1];
    d += ` L${last.x} ${last.y}`;
    return d;
  }

  /* Returns { d, start, end, mid } for an edge. End points are pulled back by
     the arrowhead length so the marker tip touches the node border exactly. */
  function routeEdge(e, A, B) {
    const bi = !!e.bidirectional;
    let p1, p2, d, pts;
    switch (e.route) {
      case 'h': {
        const forward = center(B).x > center(A).x;
        p1 = anchor(A, forward ? 'right' : 'left', e.fromDy);
        p2 = anchor(B, forward ? 'left' : 'right', e.toDy);
        p2.x += forward ? -ARROW_LEN : ARROW_LEN;
        if (bi) p1.x += forward ? ARROW_LEN : -ARROW_LEN;
        d = `M${p1.x} ${p1.y} L${p2.x} ${p2.y}`;
        break;
      }
      case 'v': {
        const down = center(B).y > center(A).y;
        p1 = anchor(A, down ? 'bottom' : 'top', e.fromDx);
        p2 = anchor(B, down ? 'top' : 'bottom', e.toDx);
        p2.y += down ? -ARROW_LEN : ARROW_LEN;
        if (bi) p1.y += down ? ARROW_LEN : -ARROW_LEN;
        d = `M${p1.x} ${p1.y} L${p2.x} ${p2.y}`;
        break;
      }
      case 's': {
        const forward = center(B).x > center(A).x;
        p1 = anchor(A, forward ? 'right' : 'left', e.fromDy);
        p2 = anchor(B, forward ? 'left' : 'right', e.toDy);
        p2.x += forward ? -ARROW_LEN : ARROW_LEN;
        const dx = Math.max(28, Math.abs(p2.x - p1.x) * 0.55);
        d = `M${p1.x} ${p1.y} C${p1.x + (forward ? dx : -dx)} ${p1.y} ${p2.x - (forward ? dx : -dx)} ${p2.y} ${p2.x} ${p2.y}`;
        break;
      }
      case 'rail': {
        /* down from A, along railY, up into B (bottom) */
        p1 = anchor(A, 'bottom');
        const end = anchor(B, 'bottom');
        p2 = { x: end.x, y: end.y + ARROW_LEN };
        pts = [p1, { x: p1.x, y: e.railY }, { x: end.x, y: e.railY }, p2];
        d = roundedPolyline(pts, 18);
        break;
      }
    }
    return { d, p1, p2 };
  }

  /* --- renderer ---------------------------------------------------------- */
  function render(container, diagram) {
    const { w, h } = diagram.viewBox;
    const svg = el('svg', { viewBox: `0 0 ${w} ${h}`, class: 'arch', role: 'img',
      'aria-label': 'Architecture diagram' });

    /* markers: light (base) and full (highlight) variant per style */
    const defs = el('defs');
    const marker = (id, cls, reverse) => el('marker', {

  const Deck = { registerProject(def) { projects.push(def); projects.sort((a, b) => a.index - b.index); }, projects, pages: [], current: 0 };

  const h = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
  const uiIcon = name => `<svg class="ui-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${global.Icons.ui[name]}</svg>`;
  const pad2 = n => String(n).padStart(2, '0');
  const logoSvg = key => { const L = global.Logos[key]; return `<svg class="brand-logo" viewBox="${L.viewBox}" aria-label="ABB">${L.body}</svg>`; };
  const OVERVIEW_TEXT = {
    architecture: 'Full architecture. Press Play to trace one cycle end-to-end, or hover a component to inspect it.',
    workflow: 'All steps shown. Press Play to walk through them, or use ← → to step.'
  };

  /* ---- stage scaling ---------------------------------------------------- */
  function fitStage(stage) {
    const s = Math.min(global.innerWidth / STAGE_W, global.innerHeight / STAGE_H);
    stage.style.transform = `translate(-50%, -50%) scale(${s})`;
  }

  /* ---- shared chrome ---------------------------------------------------- */
  function header(project, page, total, showTitle) {
    const hd = h('header', 'hdr');
    hd.innerHTML = `
      <div class="hdr-brand">${logoSvg('abb')}<span class="brand-sep"></span><span class="brand-text">Agentic Use Cases</span></div>
      <div class="hdr-title">${showTitle ? `<h1>${project.title}</h1><p>${project.subtitle}</p>` : ''}</div>
      <div class="hdr-meta">
        <span class="meta-label">Project ${pad2(project.index)}</span>
        <button class="nav-btn" data-nav="prev" title="Previous page (PgUp)">${uiIcon('prevSlide')}</button>
        <span class="page-num"><b>${pad2(page)}</b><i>/</i>${pad2(total)}</span>
        <button class="nav-btn" data-nav="next" title="Next page (PgDn)">${uiIcon('nextSlide')}</button>
      </div>`;
    return hd;
  }

  function controlBar(opts) {
    const bar = h('footer', 'bar' + (opts.player ? '' : ' bar-static'));
    bar.innerHTML = `
      <div class="bar-stages">${(opts.stages || []).map(s => `<button class="stage-pill" data-stage="${s.id}" title="${s.title}"><b>${s.num}</b><span>${s.title}</span></button>`).join('')}</div>
      ${opts.player ? `
      <div class="bar-controls">
        <button class="ctl" data-act="prev" title="Step back (←)">${uiIcon('prev')}</button>
        <button class="ctl ctl-play" data-act="toggle" title="Play (Space)">${uiIcon('play')}<span class="ctl-label">${opts.playLabel}</span></button>
        <button class="ctl" data-act="next" title="Step forward (→)">${uiIcon('next')}</button>
        <span class="ctl-gap"></span>
        <button class="ctl ctl-sm" data-act="replay" title="Replay (R)">${uiIcon('replay')}</button>
        <button class="ctl ctl-sm" data-act="overview" title="Overview (Esc)">${uiIcon('overview')}</button>
      </div>
      <div class="bar-caption"><div class="cap-head"><span class="cap-step">Overview</span><span class="cap-title"></span></div><p class="cap-text">${opts.overviewText}</p></div>`
      : `<div class="bar-hint">${opts.hint || ''}</div>`}
      <div class="bar-tools">
        <button class="ctl ctl-sm" data-act="help" title="Keyboard shortcuts (?)">${uiIcon('help')}</button>
        <button class="ctl ctl-sm" data-act="fullscreen" title="Present full screen (F)">${uiIcon('expand')}</button>
      </div>`;
    return bar;
  }

  /* wires a player to its bar (captions, pills, button labels) */
  function bindBar(bar, player, def, stages, overviewText, playLabel) {
    const capStep = bar.querySelector('.cap-step'), capTitle = bar.querySelector('.cap-title'), capText = bar.querySelector('.cap-text');
    const playBtn = bar.querySelector('.ctl-play');
    const pills = Array.from(bar.querySelectorAll('.stage-pill'));
    player.ui = {
      onState(st) {
        if (st.step) { capStep.textContent = `Step ${pad2(st.index + 1)} / ${pad2(st.total)}`; capTitle.textContent = st.step.title; capText.textContent = st.step.caption; }
        else { capStep.textContent = 'Overview'; capTitle.textContent = ''; capText.textContent = overviewText; }
        const playing = st.mode === 'playing';
        const atEnd = st.index >= st.total - 1 && !playing && (!player.tl || player.tl.time >= player.tl.duration);
        playBtn.innerHTML = `${uiIcon(playing ? 'pause' : 'play')}<span class="ctl-label">${playing ? 'Pause' : (st.index < 0 ? playLabel : (atEnd ? 'Replay' : 'Resume'))}</span>`;
        bar.classList.toggle('is-playing', playing);
        const curIdx = st.step ? stages.findIndex(s => s.id === st.step.stage) : -1;
        pills.forEach(p => {
          const i = stages.findIndex(s => s.id === p.dataset.stage);
          p.classList.toggle('active', i === curIdx);
          p.classList.toggle('done', curIdx >= 0 && i < curIdx);
        });
        bar.querySelector('[data-act="prev"]').disabled = st.index < 0;
        bar.querySelector('[data-act="next"]').disabled = atEnd;
      }
    };
    pills.forEach(p => p.addEventListener('click', () => {
      const i = player.steps.findIndex(s => s.stage === p.dataset.stage);
      if (i >= 0) { player.mode = 'stepping'; player.goTo(i, { fast: true }); }
    }));
    player._emit();
  }

  function helpOverlay() {
    const help = h('div', 'help'); help.hidden = true;
    help.innerHTML = `
      <div class="help-card">
        <div class="help-head"><h2>Presenter controls</h2><button class="ctl ctl-sm" data-act="help" title="Close">✕</button></div>
        <dl>
          <dt>→ &nbsp;←</dt><dd>Next / previous step; at the end (or start) of a page, moves to the next / previous page</dd>
          <dt>PgDn &nbsp;PgUp</dt><dd>Next / previous page</dd>
          <dt>Space</dt><dd>Play / pause the current page's animation</dd>
          <dt>R</dt><dd>Replay from the start</dd>
          <dt>Esc &nbsp;O</dt><dd>Return to full overview</dd>
          <dt>1 – 9 &nbsp;Home &nbsp;End</dt><dd>Jump to step</dd>
          <dt>F</dt><dd>Toggle full screen</dd>
          <dt>Click</dt><dd>Pin / unpin a component inspector (architecture pages)</dd>
        </dl>
        <label class="help-toggle"><input type="checkbox" class="rm-toggle"> Reduce motion <small>(auto-detected from system preference)</small></label>
      </div>`;
    return help;
  }

  /* ---- page: cover -------------------------------------------------------- */
  function renderCover(project, page, total) {
    const slide = h('section', 'slide slide-cover');
    slide.appendChild(header(project, page, total, false));
    const P = project.problem;
    const body = h('div', 'cover');
    body.innerHTML = `
      <div class="cover-left">
        <span class="eyebrow rise"><i class="eyebrow-dash"></i>Project ${pad2(project.index)} of ${pad2(projects.length)}</span>
        <h1 class="cover-title rise">${project.title}</h1>
        <p class="cover-sub rise">${project.subtitle}</p>
        <p class="cover-direction rise">${P.direction || ''}</p>
      </div>
      <div class="cover-right">
        <span class="eyebrow rise"><i class="eyebrow-dash"></i>${P.eyebrow}</span>
        <p class="cover-statement rise">${P.statement}</p>
        ${P.support ? `<p class="cover-support rise">${P.support}</p>` : ''}
        ${P.metrics ? `<ul class="metrics">${P.metrics.map(m => `<li class="metric rise"><b>${m.value}</b><span>${m.label}</span>${m.note ? `<small>${m.note}</small>` : ''}</li>`).join('')}</ul>` : ''}
        <ol class="issues cover-issues cols-${P.issues.length}">
          ${P.issues.map((it, i) => `<li class="issue rise"><span class="issue-num">${pad2(i + 1)}</span><div class="issue-body"><h3>${it.title}</h3><p>${it.text}</p></div></li>`).join('')}
        </ol>
      </div>`;
    slide.appendChild(body);
    slide.appendChild(controlBar({ hint: `Press <b>→</b> to open the architecture, or <b>PgDn</b> / <b>PgUp</b> to move between pages` }));
    slide.querySelectorAll('.rise').forEach((el, i) => el.style.setProperty('--i', i));
    return { el: slide, type: 'cover', project, player: null };
  }

  /* ---- page: architecture ----------------------------------------------- */
  function renderArchitecture(project, page, total) {
    const def = project;
    const slide = h('section', 'slide slide-arch');
    slide.appendChild(header(project, page, total, true));
    const wrap = h('section', 'arch-wrap');
    const head = h('div', 'arch-head');
    head.innerHTML = `<span class="eyebrow"><i class="eyebrow-dash"></i>Proposed agentic architecture</span>
      <span class="arch-flow">${def.diagram.stages.map(s => s.title).join(' <i>→</i> ')}</span>`;
    wrap.appendChild(head);
    const canvas = h('div', 'arch-canvas');
    wrap.appendChild(canvas);
    slide.appendChild(wrap);
    const bar = controlBar({ player: true, stages: def.diagram.stages, overviewText: OVERVIEW_TEXT.architecture, playLabel: 'Play Workflow' });
    slide.appendChild(bar);
    const pop = h('div', 'inspector'); pop.setAttribute('role', 'dialog'); pop.hidden = true; canvas.appendChild(pop);

    const arch = global.Architecture.render(canvas, def.diagram);
    const player = new global.Trace.TracePlayer(arch, def.trace, null);
    bindBar(bar, player, def, def.diagram.stages, OVERVIEW_TEXT.architecture, 'Play Workflow');

    /* inspector */
    const kindLabel = { agent: 'AI agent', external: 'External system', data: 'Data / output', human: 'Human decision', ok: 'Outcome', deny: 'Outcome', input: 'Input', infra: 'Infrastructure', product: 'Enterprise system', proposed: 'Proposed capability', process: 'Operational step' };
    const nodeName = id => arch.nodesById[id].lines.join(' ');
    let pinned = null, hoverTimer = null;
    function showInspector(id) {
      const n = arch.nodesById[id], a = arch.adj[id], stage = arch.stageOf(id);
      const li = list => list.map(x => `<li><i class="dot dot-${x.via}"></i>${x.who}${x.bi ? ' <small>↔</small>' : ''}</li>`).join('') || '<li class="none">—</li>';
      pop.innerHTML = `
        <div class="insp-head"><span class="insp-kind kind-${n.kind}">${kindLabel[n.kind] || n.kind}</span><span class="insp-stage">${stage.num} · ${stage.title}</span></div>
        <h3>${nodeName(id)}</h3><p>${n.role}</p>
        <div class="insp-cols">
          <div><h4>Receives from</h4><ul>${li(a.in.map(e => ({ who: nodeName(e.from), via: e.style, bi: e.bidirectional })))}</ul></div>
          <div><h4>Sends to</h4><ul>${li(a.out.map(e => ({ who: nodeName(e.to), via: e.style, bi: e.bidirectional })))}</ul></div>
        </div>`;
      pop.hidden = false;
      const vb = def.diagram.viewBox, cw = canvas.clientWidth, ch = canvas.clientHeight;
      const s = Math.min(cw / vb.w, ch / vb.h), ox = (cw - vb.w * s) / 2, oy = (ch - vb.h * s) / 2;
      const nx = ox + n.x * s, ny = oy + n.y * s, nw = n.w * s, nh = n.h * s;
      const pw = pop.offsetWidth, ph = pop.offsetHeight;
      let left = Math.max(8, Math.min(cw - pw - 8, nx + nw / 2 - pw / 2));
      let top = ny + nh + 14, above = false;
      if (top + ph > ch - 8) { top = ny - ph - 14; above = true; }
      pop.style.left = `${left}px`; pop.style.top = `${top}px`;
      pop.classList.toggle('above', above);
      pop.style.setProperty('--arrow-x', `${nx + nw / 2 - left}px`);
      arch.svg.classList.add('focus');
      arch.svg.querySelectorAll('.node').forEach(g => g.classList.toggle('related', g.dataset.id === id || a.in.some(e => e.from === g.dataset.id) || a.out.some(e => e.to === g.dataset.id)));
      arch.svg.querySelectorAll('.edge').forEach(g => g.classList.toggle('related', a.edges.includes(g.dataset.id)));
    }
    function closeInspector() {
      pinned = null; pop.hidden = true;
      arch.svg.classList.remove('focus');
      arch.svg.querySelectorAll('.related, .node.pinned').forEach(x => x.classList.remove('related', 'pinned'));
    }
    arch.svg.addEventListener('mouseover', e => { const g = e.target.closest('.node'); if (!g || pinned) return; clearTimeout(hoverTimer); hoverTimer = setTimeout(() => showInspector(g.dataset.id), 90); });
    arch.svg.addEventListener('mouseout', e => { const g = e.target.closest('.node'); if (!g || pinned) return; if (e.relatedTarget && g.contains(e.relatedTarget)) return; clearTimeout(hoverTimer); closeInspector(); });
    arch.svg.addEventListener('click', e => {
      const g = e.target.closest('.node');
      if (!g) { closeInspector(); return; }
      if (pinned === g.dataset.id) { closeInspector(); return; }
      closeInspector(); pinned = g.dataset.id; g.classList.add('pinned'); showInspector(pinned);
    });
    arch.svg.addEventListener('keydown', e => { const g = e.target.closest('.node'); if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); e.stopPropagation(); g.dispatchEvent(new MouseEvent('click', { bubbles: true })); } });
    document.addEventListener('click', e => { if (pinned && !e.target.closest('.arch-canvas')) closeInspector(); });

    return { el: slide, type: 'architecture', project, player, arch, closeInspector, hasPinned: () => !!pinned };
  }

  /* ---- page: workflow (text) --------------------------------------------- */
  function renderWorkflow(project, page, total) {
    const def = project;
    const slide = h('section', 'slide slide-wf');
    slide.appendChild(header(project, page, total, true));
    const wf = h('section', 'wf');
    const stages = def.diagram.stages;
    let n = 0;
    wf.innerHTML = `
      <div class="wf-head"><span class="eyebrow"><i class="eyebrow-dash"></i>Workflow · step by step</span>
        <h2>${def.workflowTitle || 'How one cycle moves through the system'}</h2></div>
      <div class="wf-cols cols-${stages.length}">
        ${stages.map(s => `
          <div class="wf-col" data-stage="${s.id}">
            <div class="wf-col-head"><b>${s.num}</b><span>${s.title}</span></div>
            <ol class="wf-list">
              ${def.trace.map((st, i) => st.stage === s.id ? `<li class="wf-step" data-i="${i}"><span class="wf-num">${pad2(i + 1)}</span><div><h4>${st.title}</h4><p>${st.caption}</p></div></li>` : '').join('')}
            </ol>
          </div>`).join('')}
      </div>`;
    slide.appendChild(wf);
    const bar = controlBar({ player: true, stages, overviewText: OVERVIEW_TEXT.workflow, playLabel: 'Play Steps' });
    slide.appendChild(bar);
    /* steps are in DOM order per column; map blocks back to trace order */
    const blocks = Array.from(wf.querySelectorAll('.wf-step')).sort((a, b) => a.dataset.i - b.dataset.i);
    const player = new global.Workflow.WorkflowPlayer(wf, def.trace, null);
    player.blocks = blocks;
    bindBar(bar, player, def, stages, OVERVIEW_TEXT.workflow, 'Play Steps');
    blocks.forEach(b => b.addEventListener('click', () => { player.mode = 'stepping'; player.goTo(Number(b.dataset.i)); }));
    return { el: slide, type: 'workflow', project, player };
  }

  /* ---- navigation --------------------------------------------------------- */
  function show(i, dir) {
    const pages = Deck.pages;
    if (i < 0 || i >= pages.length || i === Deck.current && pages[i].el.classList.contains('is-active')) return;
    const from = pages[Deck.current], to = pages[i];
    if (from.player && from.player.mode === 'playing') from.player.pause();
    if (from.closeInspector) from.closeInspector();
    dir = dir || (i > Deck.current ? 1 : -1);
    pages.forEach(p => p.el.classList.remove('is-active', 'is-before', 'is-after', 'entered'));
    pages.forEach((p, k) => p.el.classList.add(k < i ? 'is-before' : k > i ? 'is-after' : 'is-active'));
    Deck.current = i;
    requestAnimationFrame(() => requestAnimationFrame(() => to.el.classList.add('entered')));
    document.title = `${to.project.title} · ${pad2(i + 1)}/${pad2(pages.length)}`;
  }
  const next = () => show(Deck.current + 1, 1);
  const prev = () => show(Deck.current - 1, -1);

  /* ---- boot ----------------------------------------------------------------- */
  document.addEventListener('DOMContentLoaded', () => {
    const stage = document.querySelector('.stage'), root = document.querySelector('.slides');
    fitStage(stage); global.addEventListener('resize', () => fitStage(stage));
    const total = projects.length * 3;
    let page = 0;
    projects.forEach(p => {
      Deck.pages.push(renderCover(p, ++page, total));
      Deck.pages.push(renderArchitecture(p, ++page, total));
      Deck.pages.push(renderWorkflow(p, ++page, total));
    });
    Deck.pages.forEach(p => root.appendChild(p.el));
    const help = helpOverlay(); root.appendChild(help);

    /* reduced motion */
    const rm = help.querySelector('.rm-toggle'), mq = global.matchMedia('(prefers-reduced-motion: reduce)');
    const applyRM = v => { Deck.pages.forEach(p => p.player && p.player.setReducedMotion(v)); document.documentElement.classList.toggle('reduced-motion', v); rm.checked = v; };
    applyRM(mq.matches); mq.addEventListener && mq.addEventListener('change', e => applyRM(e.matches));
    rm.addEventListener('change', () => applyRM(rm.checked));

    const cur = () => Deck.pages[Deck.current];
    const actions = {
      toggle: () => cur().player ? cur().player.toggle() : next(),
      prev: () => cur().player && cur().player.prev(),
      next: () => cur().player && cur().player.next(),
      replay: () => cur().player && cur().player.replay(),
      overview: () => { const p = cur(); p.player && p.player.overview(); p.closeInspector && p.closeInspector(); },
      help: () => { help.hidden = !help.hidden; },
      fullscreen: () => { document.fullscreenElement ? document.exitFullscreen() : (document.documentElement.requestFullscreen && document.documentElement.requestFullscreen()); }
    };
    root.addEventListener('click', e => {
      const nav = e.target.closest('[data-nav]'); if (nav) { nav.dataset.nav === 'next' ? next() : prev(); return; }
      const b = e.target.closest('[data-act]'); if (b && actions[b.dataset.act]) actions[b.dataset.act]();
    });
    help.addEventListener('click', e => { if (e.target === help) help.hidden = true; });

    const playerAtEnd = p => !p.player || (p.player.index >= p.player.steps.length - 1 && p.player.mode !== 'playing' && (!p.player.tl || p.player.tl.time >= p.player.tl.duration));
    document.addEventListener('keydown', e => {
      if (e.target.matches('input, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
      const k = e.key, p = cur();
      if (!help.hidden && k !== '?' && k !== 'Escape') return;
      switch (k) {
        case ' ': e.preventDefault(); actions.toggle(); break;
        case 'ArrowRight': case 'ArrowDown': e.preventDefault(); playerAtEnd(p) ? next() : p.player.next(); break;
        case 'ArrowLeft': case 'ArrowUp': e.preventDefault(); (!p.player || p.player.index < 0) ? prev() : p.player.prev(); break;
        case 'PageDown': case ']': e.preventDefault(); next(); break;
        case 'PageUp': case '[': e.preventDefault(); prev(); break;
        case 'Home': if (p.player) { p.player.mode = 'stepping'; p.player.goTo(0, { fast: true }); } break;
        case 'End': if (p.player) { p.player.mode = 'stepping'; p.player.goTo(p.player.steps.length - 1, { fast: true }); } break;
        case 'r': case 'R': actions.replay(); break;
        case 'o': case 'O': actions.overview(); break;
        case 'f': case 'F': actions.fullscreen(); break;
        case '?': actions.help(); break;
        case 'Escape':
          if (!help.hidden) { help.hidden = true; break; }
          if (p.hasPinned && p.hasPinned()) { p.closeInspector(); break; }
          actions.overview(); break;
        default:
          if (/^[1-9]$/.test(k) && p.player) { const i = Number(k) - 1; if (i < p.player.steps.length) { p.player.mode = 'stepping'; p.player.goTo(i, { fast: true }); } }
      }
    });

    show(0, 1);
    requestAnimationFrame(() => document.body.classList.add('ready'));
  });

  Deck.show = show; Deck.next = next; Deck.prev = prev;
  global.Deck = Deck;
})(window);

/* =============================================================================
   Project 01 — Endpoint Elevated Approval
   Slide definition: problem statement, architecture (nodes / edges / stages),
   and the orchestrated execution trace.

   This is pure data. The renderer (architecture.js), the trace engine
   (trace.js) and the deck shell (deck.js) know nothing about this project.
   A second project is added by creating a sibling file that registers another
   slide with the same shape.
   ========================================================================== */
(function (Deck) {
  'use strict';

  /* Diagram grid (viewBox units). Columns A–H, rows r1–r5. */
  const NODE_W = 172;
  const NODE_H = 76;
  const COL = { A: 28, B: 256, C: 488, D: 724, E: 956, F: 1192, G: 1424, H: 1660 };
  const ROW = { r1: 100, r2: 232, r3: 364, r4: 496, r5: 628 };

  const node = (id, col, row, spec) => Object.assign(
    { id, x: COL[col], y: ROW[row] - NODE_H / 2, w: NODE_W, h: NODE_H },
    spec
  );

  const slide = {
    id: 'endpoint-elevated-approval',
    index: 1,
    title: 'Endpoint Elevated Approval',
    subtitle: 'Agentic Architecture & Decision Workflow',

    problem: {
      eyebrow: 'The challenge today',
      statement: 'Elevated access decisions depend on individual judgment rather than consistent, risk-informed evaluation.',

        {
          title: 'Manual approval dependency',

        },
        {

        },
        {
          title: 'Inconsistent human judgment',

      ],
      direction: 'Proposed direction: coordinated policy evaluation, tool-assisted context, structured triage, human oversight and documented outcomes.'
    },

    diagram: {
      viewBox: { w: 1856, h: 712 },
      stages: [
        { id: 's1', num: '01', title: 'Request Intake',        x: 12,   w: 204, desc: 'A request is raised and queued' },
        { id: 's2', num: '02', title: 'Agent Orchestration',   x: 240,  w: 436, desc: 'Policy rules and tool findings' },
        { id: 's3', num: '03', title: 'Context & Decisioning', x: 708,  w: 436, desc: 'Context is assembled and triaged with human oversight' },
        { id: 's4', num: '04', title: 'Action & Outcomes',     x: 1176, w: 436, desc: 'Controlled execution to exactly one outcome' },
        { id: 's5', num: '05', title: 'Record Feedback',       x: 1644, w: 204, desc: 'Outcomes are documented' }
      ],
      laneY: 8,
      laneH: 690,

      nodes: [
        node('access', 'A', 'r2', { kind: 'input', icon: 'key', eyebrow: 'Input', lines: ['Access', 'Request'], stage: 's1',
          role: 'An elevated endpoint access request raised by a user or device owner. This is the trigger for the workflow.' }),
        node('queue', 'A', 'r3', { kind: 'infra', icon: 'cloud', eyebrow: 'Queue', lines: ['Cloud', 'Queue'], stage: 's1',
          role: 'Buffers incoming requests so they are processed in order and nothing is lost before the agents pick them up.' }),

        node('orch', 'B', 'r3', { kind: 'agent', icon: 'hub', eyebrow: 'Coordination', lines: ['Orchestrator', 'Agent'], stage: 's2',
          role: 'Takes a request from the queue and coordinates the Policy Agent, the Tool Agent and the assembly of Context.' }),
        node('orgpolicy', 'C', 'r1', { kind: 'external', icon: 'landmark', eyebrow: 'Policy source', lines: ['Organization', 'Policy'], stage: 's2',
          role: 'The organisation’s access and security policies. Consulted by the Policy Agent; results flow back.' }),
