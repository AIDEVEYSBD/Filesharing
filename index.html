/* =====================================================================
   FAIL-LOUD — throws and paints the error on screen. No silent states.
   ===================================================================== */
function renderFatal(msg) {
  const f = document.getElementById("fatal");
  f.textContent = "STARTUP / RUNTIME FAILURE\n\n" + msg;
  f.style.display = "block";
}
window.addEventListener("error", function (e) {
  renderFatal(e.message + "\n" + (e.filename || "") + ":" + (e.lineno || "?"));
});
function assert(cond, msg) {
  if (!cond) { renderFatal(msg); throw new Error(msg); }
}

function countChar(rows, pred) {
  let n = 0;
  for (const r of rows) for (const ch of r) if (pred(ch)) n++;
  return n;
}

function validateContent() {
  assert(Number.isInteger(CONTENT.rules.lives) && CONTENT.rules.lives > 0,
    "CONTENT.rules.lives must be a positive integer");
  for (const kind of ["correct", "plausible", "wrong"]) {
    const d = CONTENT.rules.damage[kind];
    assert(d && Number.isInteger(d.toEnemy) && Number.isInteger(d.toPlayer) && d.toEnemy >= 0 && d.toPlayer >= 0,
      "CONTENT.rules.damage." + kind + " must have non-negative integer toEnemy/toPlayer");
  }
  assert(CONTENT.rules.damage.correct.toEnemy > 0, "correct picks must damage the enemy");

  assert(Array.isArray(CONTENT.characters) && CONTENT.characters.length >= 2,
    "CONTENT.characters needs at least 2 entries");
  for (const c of CONTENT.characters) {
    const where = "character '" + (c.id || "<no id>") + "'";
    for (const key of ["id", "name", "tagline", "tiles"]) assert(key in c, where + " missing '" + key + "'");
    assert(Array.isArray(c.tiles) && c.tiles.length === 6, where + ".tiles must list 6 sprite indices");
    for (const t of c.tiles) assert(Number.isInteger(t) && t >= 0 && t < SHEET_TILES, where + " tile " + t + " outside sheet");
  }

  assert(Array.isArray(CONTENT.controls) && CONTENT.controls.length === 6,
    "CONTENT.controls must be an array of 6 entries");
  const controlIds = new Set();
  for (const c of CONTENT.controls) {
    assert(typeof c.id === "string" && c.id.length > 0, "control missing id: " + JSON.stringify(c));
    assert(typeof c.label === "string" && c.label.length > 0, "control missing label: " + c.id);
    assert(!controlIds.has(c.id), "duplicate control id: " + c.id);
    controlIds.add(c.id);
  }

  assert(Array.isArray(CONTENT.enemies) && CONTENT.enemies.length >= 1,
    "CONTENT.enemies must be a non-empty array");
  const enemyIds = new Set();
  for (const e of CONTENT.enemies) {
    const where = "enemy '" + (e.id || "<no id>") + "'";
    for (const key of ["id", "name", "spriteIndex", "flavor", "correct", "plausible", "wrong", "explainers"]) {
      assert(key in e, where + " is missing required key '" + key + "'");
    }
    enemyIds.add(e.id);
    assert(Number.isInteger(e.spriteIndex) && e.spriteIndex >= 0 && e.spriteIndex < SHEET_TILES,
      where + " spriteIndex " + e.spriteIndex + " outside sheet (0.." + (SHEET_TILES - 1) + ")");
    assert(Array.isArray(e.flavor) && e.flavor.length >= 1, where + ".flavor must be a non-empty array");
    assert(Array.isArray(e.plausible) && e.plausible.length === 2, where + ".plausible must list exactly 2 control ids");
    const referenced = [e.correct, e.plausible[0], e.plausible[1], e.wrong];
    for (const cid of referenced) assert(controlIds.has(cid), where + " references unknown control id '" + cid + "'");
    assert(new Set(referenced).size === 4, where + " references the same control twice: " + referenced.join(", "));
    for (const cid of referenced) {
      assert(typeof e.explainers[cid] === "string" && e.explainers[cid].length > 0,
        where + " has no explainer for control '" + cid + "'");
    }
  }

  for (const [gid, g] of Object.entries(CONTENT.minigames)) {
    const where = "minigame '" + gid + "'";
    assert(["quiz2", "pick", "timing", "pong", "catch"].includes(g.type), where + " has unknown type '" + g.type + "'");
    assert(typeof g.title === "string" && g.title.length > 0, where + " missing title");
    assert(typeof g.prompt === "string" && g.prompt.length > 0, where + " missing prompt");
    if (g.type === "quiz2") {
      assert(typeof g.yesLabel === "string" && typeof g.noLabel === "string", where + " needs yesLabel/noLabel");
      assert(Number.isInteger(g.bonusPer) && g.bonusPer > 0, where + " needs bonusPer");
      assert(Array.isArray(g.items) && g.items.length >= 1, where + " needs items");
      g.items.forEach((it, i) => {
        assert(typeof it.text === "string" && typeof it.phish === "boolean" && typeof it.why === "string",
          where + " item " + i + " needs text/phish/why");
      });
    } else if (g.type === "pick") {
      assert(Number.isInteger(g.bonusPer) && g.bonusPer > 0, where + " needs bonusPer");
      assert(Array.isArray(g.rounds) && g.rounds.length >= 1, where + " needs rounds");
      g.rounds.forEach((r, i) => {
        assert(Array.isArray(r.options) && r.options.length >= 2, where + " round " + i + " needs options");
        assert(Number.isInteger(r.correct) && r.correct >= 0 && r.correct < r.options.length,
          where + " round " + i + " correct index out of range");
        assert(typeof r.why === "string" && r.why.length > 0, where + " round " + i + " needs why");
      });
    } else if (g.type === "timing") {
      assert(Number.isInteger(g.hits) && g.hits > 0, where + " needs hits");
      assert(Number.isInteger(g.bonusPerHit) && g.bonusPerHit > 0, where + " needs bonusPerHit");
      assert(typeof g.why === "string" && g.why.length > 0, where + " needs why");
      assert(typeof g.howTo === "string" && g.howTo.length > 0, where + " needs howTo (ready-screen text)");
    } else { // pong, catch
      assert(Number.isInteger(g.goal) && g.goal > 0, where + " needs goal");
      assert(Number.isInteger(g.bonusPer) && g.bonusPer > 0, where + " needs bonusPer");
      assert(typeof g.why === "string" && g.why.length > 0, where + " needs why");
      assert(typeof g.howTo === "string" && g.howTo.length > 0, where + " needs howTo (ready-screen text)");
    }
  }

  assert(Array.isArray(CONTENT.rooms) && CONTENT.rooms.length >= 1, "CONTENT.rooms must be a non-empty array");
  const roomIds = new Set();
  let startCount = 0;
  const digitsGlobal = new Set();
  for (const room of CONTENT.rooms) {
    const where = "room '" + (room.id || "<no id>") + "'";
    for (const key of ["id", "name", "map", "doors", "npcs", "infos", "games"]) {
      assert(key in room, where + " missing '" + key + "'");
    }
    assert(!roomIds.has(room.id), "duplicate room id '" + room.id + "'");
    roomIds.add(room.id);
    const rows = room.map;
    assert(Array.isArray(rows) && rows.length >= 3, where + " map must be an array of rows");
    const w = rows[0].length;
    const doorCharsInMap = new Set();
    rows.forEach((r, y) => {
      assert(r.length === w, where + " map row " + y + " has length " + r.length + ", expected " + w);
      for (const ch of r) {
        assert("#.RPNIG123456789abcdef".includes(ch), where + " map row " + y + " has illegal char '" + ch + "'");
        if (ch === "P") startCount++;
        if (ch >= "a" && ch <= "f") {
          assert(!doorCharsInMap.has(ch), where + " door '" + ch + "' appears twice in map");
          doorCharsInMap.add(ch);
        }
        if (ch >= "1" && ch <= "9") {
          assert(Number(ch) <= CONTENT.enemies.length,
            where + " terminal '" + ch + "' has no matching enemy (only " + CONTENT.enemies.length + " defined)");
          assert(!digitsGlobal.has(ch), "terminal '" + ch + "' appears in more than one place across rooms");
          digitsGlobal.add(ch);
        }
      }
    });
    assert(rows.length * 16 <= 180 && w * 16 <= 320, where + " map " + w + "x" + rows.length + " does not fit 320x180");

    for (const dch of doorCharsInMap) assert(dch in room.doors, where + " map door '" + dch + "' has no doors entry");
    for (const dch of Object.keys(room.doors)) {
      assert(doorCharsInMap.has(dch), where + " doors entry '" + dch + "' has no matching map tile");
      const dest = room.doors[dch];
      assert(dest && typeof dest.room === "string" && typeof dest.door === "string",
        where + " door '" + dch + "' needs {room, door}");
    }

    const nN = countChar(rows, ch => ch === "N");
    const nI = countChar(rows, ch => ch === "I");
    const nG = countChar(rows, ch => ch === "G");
    assert(nN === room.npcs.length, where + " map has " + nN + " 'N' but npcs lists " + room.npcs.length);
    assert(nI === room.infos.length, where + " map has " + nI + " 'I' but infos lists " + room.infos.length);
    assert(nG === room.games.length, where + " map has " + nG + " 'G' but games lists " + room.games.length);
    for (const n of room.npcs) {
      assert(typeof n.name === "string", where + " npc '" + (n.id || "?") + "' needs a name");
      assert(n.sprite in NPC_TILES, where + " npc '" + (n.id || "?") + "' has unknown sprite '" + n.sprite + "'");
      if (n.type === "hacker") {
        assert(enemyIds.has(n.challenge), where + " hacker '" + n.id + "' challenges unknown enemy '" + n.challenge + "'");
        assert(Number.isInteger(n.bonus) && n.bonus > 0, where + " hacker '" + n.id + "' needs a bonus");
        assert(Array.isArray(n.taunt) && n.taunt.length >= 1, where + " hacker '" + n.id + "' needs taunt lines");
        assert(typeof n.winLine === "string" && typeof n.loseLine === "string",
          where + " hacker '" + n.id + "' needs winLine/loseLine");
        assert(Array.isArray(n.defeatedLines) && n.defeatedLines.length >= 1,
          where + " hacker '" + n.id + "' needs defeatedLines");
      } else {
        assert(Array.isArray(n.lines) && n.lines.length >= 1, where + " npc '" + (n.id || "?") + "' needs lines");
      }
    }
    for (const inf of room.infos) {
      assert(typeof inf.title === "string" && typeof inf.text === "string", where + " info entries need title and text");
    }
    for (const gid of room.games) {
      assert(gid in CONTENT.minigames, where + " references unknown minigame '" + gid + "'");
    }
  }
  assert(startCount === 1, "exactly one 'P' start required across all rooms, found " + startCount);
  assert(digitsGlobal.size === CONTENT.enemies.length,
    "rooms place " + digitsGlobal.size + " battle terminals but CONTENT.enemies has " + CONTENT.enemies.length);
  for (let i = 1; i <= CONTENT.enemies.length; i++) {
    assert(digitsGlobal.has(String(i)), "no room places terminal '" + i + "'");
  }
  for (const room of CONTENT.rooms) {
    for (const [dch, dest] of Object.entries(room.doors)) {
      const target = CONTENT.rooms.find(r => r.id === dest.room);
      assert(target !== undefined, "room '" + room.id + "' door '" + dch + "' leads to unknown room '" + dest.room + "'");
      assert(countChar(target.map, ch => ch === dest.door) === 1,
        "room '" + room.id + "' door '" + dch + "' expects door '" + dest.door + "' in room '" + dest.room + "'");
    }
  }

  assert(Array.isArray(CONTENT.intro.lines) && CONTENT.intro.lines.length >= 1, "CONTENT.intro.lines required");
  assert(typeof CONTENT.intro.npcName === "string" && CONTENT.intro.npcName.length > 0, "CONTENT.intro.npcName required");
  assert(CONTENT.intro.sprite in NPC_TILES, "CONTENT.intro.sprite unknown");

  for (const key of ["titleSub", "titleStart", "titleContinue", "titleHint", "charTitle", "charHint", "attackTag", "duelTag",
                     "fxSuper", "fxPartial", "fxNone",
                     "resultCorrect", "resultPlausible", "resultWrong", "hudLine", "hudCleared", "lockdownLabel",
                     "terminalCleared", "terminalClearedTitle", "simDoneNote", "mgExit", "mgContinue", "mgFinish",
                     "winTitle", "winBody", "winBtn", "duelWinTitle", "duelLoseTitle", "duelWalkBtn",
                     "loseTitle", "loseBody", "loseBtn",
                     "defeatTitle", "defeatBody", "defeatBtn", "endTitle", "endBody", "endBtn"]) {
    assert(typeof CONTENT.strings[key] === "string" && CONTENT.strings[key].length > 0,
      "CONTENT.strings missing '" + key + "'");
  }
  assert(Array.isArray(CONTENT.strings.tableHead) && CONTENT.strings.tableHead.length === 4,
    "CONTENT.strings.tableHead must have 4 column titles");
}

function el(id) {
  const node = document.getElementById(id);
  assert(node !== null, "missing DOM element #" + id);
  return node;
}

/* =====================================================================
   AUDIO — square-wave SFX + procedural chiptune (two tracks), unlocked
   by the title interaction. All generated in WebAudio: no external files.
   ===================================================================== */
let audioCtx = null;
function initAudio() {
  if (audioCtx !== null) return;
  assert(typeof AudioContext !== "undefined", "WebAudio (AudioContext) unavailable in this browser");
  audioCtx = new AudioContext();
}
function tone(freq, t, dur, type, vol) {
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t);
  g.gain.linearRampToValueAtTime(0.0001, t + dur);
  o.connect(g);
  g.connect(audioCtx.destination);
  o.start(t);
  o.stop(t + dur);
}
function beep(freq, dur, delay) {
  tone(freq, audioCtx.currentTime + (delay || 0), dur, "square", 0.07);
}
const SFX = {
  start:     () => { beep(520, 0.09); beep(780, 0.12, 0.09); },
  correct:   () => { beep(660, 0.09); beep(880, 0.14, 0.09); },
  plausible: () => { beep(440, 0.14); },
  wrong:     () => { beep(150, 0.28); },
  faint:     () => { beep(300, 0.1); beep(220, 0.1, 0.1); beep(150, 0.2, 0.2); },
  blip:      () => { beep(700, 0.05); },
  door:      () => { beep(380, 0.07); beep(500, 0.08, 0.07); }
};

// two original loops; midi note numbers, 0 = rest
const MUSIC = {
  world: {
    step: 0.22,
    bass: [36,0,0,0, 43,0,0,0, 33,0,0,0, 41,0,0,0, 36,0,0,0, 43,0,0,0, 45,0,0,0, 43,0,41,0],
    lead: [0,0,72,0, 0,69,0,0, 67,0,0,0, 64,0,67,0, 0,0,69,0, 0,72,0,0, 76,0,74,0, 72,0,69,0]
  },
  battle: {
    step: 0.135,
    bass: [36,36,0,36, 39,36,0,36, 41,36,0,36, 39,36,43,36, 36,36,0,36, 39,36,0,36, 34,34,0,34, 39,39,41,43],
    lead: [60,0,63,0, 65,0,63,60, 0,60,63,65, 67,0,63,0, 60,0,63,0, 65,0,68,67, 0,65,63,60, 58,0,60,0]
  }
};
const music = { track: null, step: 0, nextTime: 0, timer: null };
function midiFreq(m) { return 440 * Math.pow(2, (m - 69) / 12); }
function startMusic(name) {
  if (audioCtx === null) return;
  assert(name in MUSIC, "unknown music track '" + name + "'");
  if (music.track === name) return;
  music.track = name;
  music.step = 0;
  music.nextTime = audioCtx.currentTime + 0.06;
  if (music.timer === null) music.timer = setInterval(scheduleMusic, 90);
}
function stopMusic() { music.track = null; }
function scheduleMusic() {
  if (music.track === null || G.muted || audioCtx === null) return;
  const def = MUSIC[music.track];
  if (music.nextTime < audioCtx.currentTime) music.nextTime = audioCtx.currentTime + 0.06;
  while (music.nextTime < audioCtx.currentTime + 0.3) {
    const i = music.step % def.bass.length;
    if (def.bass[i]) tone(midiFreq(def.bass[i]), music.nextTime, def.step * 0.9, "triangle", 0.05);
    if (def.lead[i]) tone(midiFreq(def.lead[i]), music.nextTime, def.step * 0.55, "square", 0.028);
    music.step++;
    music.nextTime += def.step;
  }
}

/* =====================================================================
   SAVE / PROGRESSION — stored in localStorage (the only persistence a
   single file:// page has). Per-browser, per-machine. The probe below is
   detection, not error-swallowing: failure is surfaced on the title
   screen, and an incompatible save is discarded with a visible notice.
   ===================================================================== */
const SAVE_KEY = "rackguard_save_v1";
let storageOK = false;
let storageNotice = "";
(function probeStorage() {
  try {
    const t = "__rackguard_probe__";
    localStorage.setItem(t, "1");
    localStorage.removeItem(t);
    storageOK = true;
  } catch (err) {
    storageOK = false;
    storageNotice = "SAVING DISABLED — BROWSER STORAGE UNAVAILABLE (" + err.name + ")";
  }
})();

function saveGame() {
  if (!storageOK || G.character === null || G.room === null) return;
  localStorage.setItem(SAVE_KEY, JSON.stringify({
    v: 1,
    character: G.character.id,
    roomId: G.room.id,
    tx: G.player.tx, ty: G.player.ty,
    lives: G.lives,
    score: G.score,
    progress: G.progress
  }));
}
function deleteSave() {
  if (storageOK) localStorage.removeItem(SAVE_KEY);
}
function loadSave() {
  if (!storageOK) return null;
  const raw = localStorage.getItem(SAVE_KEY);
  if (raw === null) return null;
  let s = null;
  let bad = "";
  try { s = JSON.parse(raw); } catch (err) { bad = "unreadable JSON"; }
  if (s !== null) {
    if (s.v !== 1) bad = "version mismatch";
    else if (!CONTENT.characters.some(c => c.id === s.character)) bad = "unknown character '" + s.character + "'";
    else if (!CONTENT.rooms.some(r => r.id === s.roomId)) bad = "unknown room '" + s.roomId + "'";
    else if (!Number.isInteger(s.tx) || !Number.isInteger(s.ty)) bad = "bad position";
    else if (!Number.isInteger(s.lives) || s.lives < 1 || s.lives > CONTENT.rules.lives) bad = "bad lives";
    else if (typeof s.score !== "object" || typeof s.progress !== "object") bad = "bad score/progress";
  }
  if (bad !== "") {
    localStorage.removeItem(SAVE_KEY);
    storageNotice = "PREVIOUS SAVE INCOMPATIBLE (" + bad + ") — DISCARDED";
    return null;
  }
  return s;
}

/* =====================================================================
   GAME STATE
   ===================================================================== */
const DMG = CONTENT.rules.damage;

const G = {
  mode: "title",  // title | charselect | world | dialog | wipe | unwipe | battle | minigame | ended
  sheet: null,
  ctx: null,
  character: null,
  room: null,
  player: { tx: 0, ty: 0, px: 0, py: 0, facing: "down", moving: false, destX: 0, destY: 0, walkCycle: 0 },
  keys: new Set(),
  tapDir: null,        // one queued step from a tapped key
  wipeFrames: 0,
  pending: null,
  lives: 0,
  muted: false,
  battle: { terminal: null, hacker: null, duel: false, enemy: null, enemyHP: 100, integrity: 100, order: [], phase: "pick" },
  score: { correct: 0, plausible: 0, wrong: 0, breaches: 0, bonus: 0 },
  progress: { terminals: {}, games: {}, hackers: {}, introShown: false },
  dialog: null,
  mg: null,
  panelAction: null
};

function roomDef(id) {
  const r = CONTENT.rooms.find(r => r.id === id);
  assert(r !== undefined, "unknown room id '" + id + "'");
  return r;
}
function progressKey(roomId, x, y) { return roomId + "@" + x + "," + y; }

/* =====================================================================
   ROOM BUILD + WORLD
   ===================================================================== */
function buildRoom(roomId) {
  const def = roomDef(roomId);
  const rows = def.map;
  const room = {
    def, id: def.id, name: def.name,
    w: rows[0].length, h: rows.length,
    solid: [], terminals: [], npcs: [], infos: [], games: [], doorsAt: {}
  };
  let ni = 0, ii = 0, gi = 0;
  for (let y = 0; y < room.h; y++) {
    room.solid.push([]);
    for (let x = 0; x < room.w; x++) {
      const ch = rows[y][x];
      room.solid[y][x] = (ch === "#" || ch === "R" || ch === "N" || ch === "I" || ch === "G" || (ch >= "1" && ch <= "9"));
      if (ch >= "1" && ch <= "9") {
        room.terminals.push({ x, y, enemy: CONTENT.enemies[Number(ch) - 1], key: progressKey(def.id, x, y) });
      } else if (ch === "N") {
        room.npcs.push({ x, y, def: def.npcs[ni++], key: progressKey(def.id, x, y) });
      } else if (ch === "I") {
        room.infos.push({ x, y, def: def.infos[ii++] });
      } else if (ch === "G") {
        room.games.push({ x, y, id: def.games[gi++], key: progressKey(def.id, x, y) });
      } else if (ch >= "a" && ch <= "f") {
        room.doorsAt[ch] = { x, y };
      }
    }
  }
  G.room = room;
  el("world-title").innerHTML = room.name + ' <span>//</span> RACKGUARD';
  updateHud();
}

function startRoomAndPos() {
  for (const def of CONTENT.rooms) {
    for (let y = 0; y < def.map.length; y++) {
      const x = def.map[y].indexOf("P");
      if (x !== -1) return { roomId: def.id, x, y };
    }
  }
  assert(false, "no 'P' start found in any room");
}

function placePlayer(x, y, facing) {
  G.player.tx = x; G.player.ty = y;
  G.player.px = x * 16; G.player.py = y * 16;
  G.player.moving = false;
  G.player.facing = facing;
  G.player.walkCycle = 0;
}

function terminalCleared(t) { return G.progress.terminals[t.key] === true; }
function gameCleared(g) { return G.progress.games[g.key] === true; }
function hackerDefeated(n) { return G.progress.hackers[n.key] === true; }
function totalThreatsCleared() { return Object.keys(G.progress.terminals).length; }

function entityAt(x, y) {
  const r = G.room;
  const t = r.terminals.find(t => t.x === x && t.y === y);
  if (t) return { kind: "terminal", t };
  const n = r.npcs.find(n => n.x === x && n.y === y);
  if (n) return { kind: "npc", n };
  const i = r.infos.find(i => i.x === x && i.y === y);
  if (i) return { kind: "info", i };
  const g = r.games.find(g => g.x === x && g.y === y);
  if (g) return { kind: "game", g };
  return null;
}
function doorAt(x, y) {
  for (const [ch, pos] of Object.entries(G.room.doorsAt)) {
    if (pos.x === x && pos.y === y) return ch;
  }
  return null;
}

function fitScale() {
  const k = Math.max(1, Math.min(
    Math.floor((window.innerWidth - 40) / 320),
    Math.floor((window.innerHeight - 170) / 180)
  ));
  const c = el("screen");
  c.style.width = (320 * k) + "px";
  c.style.height = (180 * k) + "px";
}

const DIRS = {
  up: { dx: 0, dy: -1 }, down: { dx: 0, dy: 1 },
  left: { dx: -1, dy: 0 }, right: { dx: 1, dy: 0 }
};
const KEYMAP = {
  "w": "up", "arrowup": "up",
  "s": "down", "arrowdown": "down",
  "a": "left", "arrowleft": "left",
  "d": "right", "arrowright": "right"
};
function heldDir() {
  for (const k of ["w", "arrowup", "s", "arrowdown", "a", "arrowleft", "d", "arrowright"]) {
    if (G.keys.has(k)) return KEYMAP[k];
  }
  return null;
}

function updateWorld() {
  const p = G.player;
  if (p.moving) {
    p.walkCycle++;
    const speed = 1;
    p.px += Math.sign(p.destX * 16 - p.px) * Math.min(speed, Math.abs(p.destX * 16 - p.px));
    p.py += Math.sign(p.destY * 16 - p.py) * Math.min(speed, Math.abs(p.destY * 16 - p.py));
    if (p.px === p.destX * 16 && p.py === p.destY * 16) {
      p.tx = p.destX; p.ty = p.destY; p.moving = false;
      const dch = doorAt(p.tx, p.ty);
      if (dch !== null) {
        G.keys.clear();
        G.tapDir = null;
        SFX.door();
        startWipe({ type: "door", dest: G.room.def.doors[dch] });
      }
    }
    return;
  }
  // held key = continuous walking; a tapped key queues exactly one step
  const dir = heldDir() || G.tapDir;
  G.tapDir = null;
  if (!dir) { p.walkCycle = 0; return; }
  p.facing = dir;
  const nx = p.tx + DIRS[dir].dx, ny = p.ty + DIRS[dir].dy;
  assert(ny >= 0 && ny < G.room.h && nx >= 0 && nx < G.room.w, "player stepped off the map at " + nx + "," + ny);

  const ent = entityAt(nx, ny);
  if (ent !== null) {
    G.keys.clear();
    G.tapDir = null;
    bumpEntity(ent);
    return;
  }
  if (!G.room.solid[ny][nx]) {
    p.destX = nx; p.destY = ny; p.moving = true;
  }
}

function bumpEntity(ent) {
  if (ent.kind === "terminal") {
    if (terminalCleared(ent.t)) {
      openDialog(CONTENT.strings.terminalClearedTitle, [CONTENT.strings.terminalCleared], { sprite: T.RACK });
    } else {
      startWipe({ type: "battle", terminal: ent.t });
    }
  } else if (ent.kind === "npc") {
    const def = ent.n.def;
    SFX.blip();
    if (def.type === "hacker") {
      if (hackerDefeated(ent.n)) {
        openDialog(def.name, def.defeatedLines.map(templateLine), { sprite: NPC_TILES[def.sprite] });
      } else {
        openDialog(def.name, def.taunt.map(templateLine), {
          sprite: NPC_TILES[def.sprite],
          onClose: () => startWipe({ type: "duel", hacker: ent.n })
        });
      }
    } else {
      openDialog(def.name, def.lines.map(templateLine), { sprite: NPC_TILES[def.sprite] });
    }
  } else if (ent.kind === "info") {
    SFX.blip();
    openDialog(ent.i.def.title, [ent.i.def.text], { sprite: T.RACK });
  } else if (ent.kind === "game") {
    SFX.blip();
    startMinigame(ent.g);
  } else {
    assert(false, "bumped unknown entity kind '" + ent.kind + "'");
  }
}

function templateLine(line) {
  assert(G.character !== null, "dialogue rendered before character selection");
  return line.split("{NAME}").join(G.character.name);
}

/* ---------- quest guidance: BFS over the room graph ---------- */
function roomHasUnclearedThreat(def) {
  for (let y = 0; y < def.map.length; y++) {
    for (let x = 0; x < def.map[y].length; x++) {
      const ch = def.map[y][x];
      if (ch >= "1" && ch <= "9" && G.progress.terminals[progressKey(def.id, x, y)] !== true) return true;
    }
  }
  return false;
}
function questTargetTile() {
  if (totalThreatsCleared() >= CONTENT.enemies.length) return null;
  const here = G.room;
  const un = here.terminals.filter(t => !terminalCleared(t));
  if (un.length > 0) {
    let best = null, bd = Infinity;
    for (const t of un) {
      const d = Math.abs(t.x - G.player.tx) + Math.abs(t.y - G.player.ty);
      if (d < bd) { bd = d; best = t; }
    }
    return { x: best.x, y: best.y };
  }
  // BFS to the nearest room that still has threats; arrow marks the first door to take
  const seen = new Set([here.id]);
  const firstDoor = {};
  const queue = [here.id];
  while (queue.length > 0) {
    const rid = queue.shift();
    const def = roomDef(rid);
    for (const [dch, dest] of Object.entries(def.doors)) {
      if (seen.has(dest.room)) continue;
      seen.add(dest.room);
      firstDoor[dest.room] = (rid === here.id) ? dch : firstDoor[rid];
      if (roomHasUnclearedThreat(roomDef(dest.room))) {
        const pos = here.doorsAt[firstDoor[dest.room]];
        assert(pos !== undefined, "quest arrow: door '" + firstDoor[dest.room] + "' missing in room '" + here.id + "'");
        return { x: pos.x, y: pos.y };
      }
      queue.push(dest.room);
    }
  }
  return null;
}

/* ---------- drawing ---------- */
function drawTile(idx, dx, dy) {
  G.ctx.drawImage(G.sheet, idx * 16, 0, 16, 16, Math.floor(dx), Math.floor(dy), 16, 16);
}
const OFF_Y = 2;

function playerTile() {
  assert(G.character !== null, "drawing player before character selection");
  const t = G.character.tiles;
  const p = G.player;
  const stride = p.moving && (Math.floor(p.walkCycle / 5) % 2 === 1);
  if (p.facing === "up")   return stride ? t[4] : t[1];
  if (p.facing === "down") return stride ? t[3] : t[0];
  return stride ? t[5] : t[2];
}

function drawWorld(now) {
  const ctx = G.ctx;
  const r = G.room;
  ctx.fillStyle = "#0b0f14";
  ctx.fillRect(0, 0, 320, 180);
  const rows = r.def.map;
  for (let y = 0; y < r.h; y++) {
    for (let x = 0; x < r.w; x++) {
      const ch = rows[y][x];
      const dx = x * 16, dy = y * 16 + OFF_Y;
      if (ch === "#") { drawTile(T.WALL, dx, dy); continue; }
      drawTile(T.FLOOR, dx, dy);
      if (ch === "R") drawTile(T.RACK, dx, dy);
    }
  }
  for (const pos of Object.values(r.doorsAt)) {
    const dx = pos.x * 16, dy = pos.y * 16 + OFF_Y;
    ctx.fillStyle = "#e6edf3";
    ctx.fillRect(Math.floor(dx + 2), Math.floor(dy + 1), 2, 13);
    ctx.fillRect(Math.floor(dx + 12), Math.floor(dy + 1), 2, 13);
    ctx.fillStyle = "#ffd23f";
    ctx.fillRect(Math.floor(dx + 4), Math.floor(dy + 1), 8, 2);
  }
  for (const i of r.infos) {
    const dx = i.x * 16, dy = i.y * 16 + OFF_Y;
    drawTile(T.RACK, dx, dy);
    ctx.fillStyle = "#e6edf3";
    ctx.fillRect(Math.floor(dx + 11), Math.floor(dy + 2), 3, 3);
  }
  for (const g of r.games) {
    const dx = g.x * 16, dy = g.y * 16 + OFF_Y;
    drawTile(T.RACK, dx, dy);
    ctx.fillStyle = gameCleared(g) ? "#3ddc84" : "#ffd23f";
    ctx.fillRect(Math.floor(dx + 11), Math.floor(dy + 2), 3, 3);
  }
  const blinkOn = (now % 600) < 300;
  for (const t of r.terminals) {
    const dx = t.x * 16, dy = t.y * 16 + OFF_Y;
    drawTile(T.RACK, dx, dy);
    ctx.fillStyle = terminalCleared(t) ? "#3ddc84" : (blinkOn ? "#ff3860" : "#16202b");
    ctx.fillRect(Math.floor(dx + 11), Math.floor(dy + 2), 3, 3);
  }
  for (const n of r.npcs) {
    drawTile(NPC_TILES[n.def.sprite], n.x * 16, n.y * 16 + OFF_Y);
  }
  // quest arrow: bobbing yellow chevron over the next main-quest tile
  const qt = questTargetTile();
  if (qt !== null) {
    const bobPx = (now % 500) < 250 ? 0 : 2;
    const ax = qt.x * 16, ay = qt.y * 16 + OFF_Y - 9 + bobPx;
    ctx.fillStyle = "#ffd23f";
    ctx.fillRect(Math.floor(ax + 3), Math.floor(ay), 10, 3);
    ctx.fillRect(Math.floor(ax + 5), Math.floor(ay + 3), 6, 3);
    ctx.fillRect(Math.floor(ax + 7), Math.floor(ay + 6), 2, 3);
  }
  // player
  const p = G.player;
  const px = Math.floor(p.px), py = Math.floor(p.py + OFF_Y);
  const idx = playerTile();
  if (p.facing === "right") {
    ctx.save();
    ctx.translate(px + 16, py);
    ctx.scale(-1, 1);
    ctx.drawImage(G.sheet, idx * 16, 0, 16, 16, 0, 0, 16, 16);
    ctx.restore();
  } else {
    drawTile(idx, px, py);
  }
  if (G.mode === "wipe" || G.mode === "unwipe") {
    const total = G.mode === "wipe" ? 30 : 22;
    const t01 = G.mode === "wipe" ? (1 - G.wipeFrames / total) : (G.wipeFrames / total);
    ctx.fillStyle = "#0b0f14";
    const bars = 8, bw = 320 / bars;
    for (let i = 0; i < bars; i++) {
      ctx.fillRect(Math.floor(i * bw), 0, Math.floor(bw * t01) + (t01 > 0 ? 1 : 0), 180);
    }
  }
}

function locksMarkup() {
  const max = CONTENT.rules.lives;
  return CONTENT.strings.lockdownLabel + " " +
    "&#9632;".repeat(G.lives) + "&#9633;".repeat(max - G.lives);
}

function updateHud() {
  el("hud").innerHTML =
    "<b>" + CONTENT.strings.hudCleared + " " + totalThreatsCleared() + "/" + CONTENT.enemies.length + "</b>" +
    " &nbsp;&#183;&nbsp; <span class=\"locks\">" + locksMarkup() + "</span>" +
    " &nbsp;&#183;&nbsp; BONUS " + G.score.bonus +
    "<br>" + CONTENT.strings.hudLine;
}

function startWipe(pending) {
  G.mode = "wipe";
  G.wipeFrames = 30;
  G.pending = pending;
}

function completeWipe() {
  const pend = G.pending;
  G.pending = null;
  assert(pend !== null && pend !== undefined, "wipe completed with nothing pending");
  if (pend.type === "battle") {
    G.mode = "battle";
    el("world").style.display = "none";
    startBattle(pend.terminal);
  } else if (pend.type === "duel") {
    G.mode = "battle";
    el("world").style.display = "none";
    startDuel(pend.hacker);
  } else if (pend.type === "door") {
    buildRoom(pend.dest.room);
    const pos = G.room.doorsAt[pend.dest.door];
    assert(pos !== undefined, "arrived at room '" + pend.dest.room + "' missing door '" + pend.dest.door + "'");
    placePlayer(pos.x, pos.y, "down");
    G.mode = "unwipe";
    G.wipeFrames = 22;
    saveGame();
  } else {
    assert(false, "unknown pending type '" + pend.type + "'");
  }
}

function tick(now) {
  if (G.mode === "world") {
    updateWorld();
    drawWorld(now);
  } else if (G.mode === "dialog") {
    drawWorld(now);
  } else if (G.mode === "wipe") {
    drawWorld(now);
    G.wipeFrames--;
    if (G.wipeFrames <= 0) completeWipe();
  } else if (G.mode === "unwipe") {
    drawWorld(now);
    G.wipeFrames--;
    if (G.wipeFrames <= 0) {
      G.mode = "world";
      if (!G.progress.introShown) {
        G.progress.introShown = true;
        saveGame();
        openDialog(CONTENT.intro.npcName, CONTENT.intro.lines.map(templateLine),
          { sprite: NPC_TILES[CONTENT.intro.sprite] });
      }
    }
  }
  requestAnimationFrame(tick);
}

/* =====================================================================
   DIALOGUE — portrait + typewriter; click/Enter/Space skips then advances
   ===================================================================== */
function openDialog(name, lines, opts) {
  assert(Array.isArray(lines) && lines.length >= 1, "openDialog needs at least one line");
  opts = opts || {};
  if (G.dialog && G.dialog.typeTimer !== null) clearInterval(G.dialog.typeTimer);
  G.dialog = { name, lines, idx: 0, onClose: opts.onClose || null, typing: false, typeTimer: null };
  G.mode = "dialog";
  el("dialog-name").textContent = name;
  const face = el("dialog-face");
  if (Number.isInteger(opts.sprite)) {
    face.src = spriteURIs[opts.sprite];
    face.style.display = "block";
  } else {
    face.style.display = "none";
  }
  el("dialog").style.display = "block";
  typeLine();
}
function typeLine() {
  const d = G.dialog;
  const full = d.lines[d.idx];
  const target = el("dialog-text");
  target.textContent = "";
  d.typing = true;
  let i = 0;
  d.typeTimer = setInterval(() => {
    if (!G.dialog || G.dialog !== d || !d.typing) { clearInterval(d.typeTimer); return; }
    i += 2;
    target.textContent = full.slice(0, i);
    if (i >= full.length) {
      target.textContent = full;
      d.typing = false;
      clearInterval(d.typeTimer);
      d.typeTimer = null;
    }
  }, 16);
}
function advanceDialog() {
  const d = G.dialog;
  if (!d) return;
  if (d.typing) {
    d.typing = false;
    if (d.typeTimer !== null) { clearInterval(d.typeTimer); d.typeTimer = null; }
    el("dialog-text").textContent = d.lines[d.idx];
    return;
  }
  SFX.blip();
  d.idx++;
  if (d.idx < d.lines.length) {
    typeLine();
    return;
  }
  G.dialog = null;
  el("dialog").style.display = "none";
  G.mode = "world";
  if (d.onClose) d.onClose();
}

/* =====================================================================
   MINIGAMES — quick one-shot sims. Keyboard: 1-4 answer, SPACE act,
   A/D or arrows move, ENTER continue, ESC leave.
   ===================================================================== */
function startMinigame(gameEnt) {
  const def = CONTENT.minigames[gameEnt.id];
  G.mode = "minigame";
  G.mg = { ent: gameEnt, def, idx: 0, right: 0, hits: 0, patch: null, arcade: null, keymap: {} };
  el("mg-title").textContent = def.title;
  el("mg-prompt").textContent = def.prompt + (gameCleared(gameEnt) ? " " + CONTENT.strings.simDoneNote : "");
  el("mg-exit").textContent = CONTENT.strings.mgExit;
  el("minigame").style.display = "block";
  if (def.type === "quiz2") renderQuizItem();
  else if (def.type === "pick") renderPickRound();
  else renderReady(); // action sims get a how-to screen first
}

function renderReady() {
  const m = G.mg;
  const body = el("mg-body");
  body.innerHTML = "";
  const how = document.createElement("div");
  how.className = "mg-item";
  how.textContent = m.def.howTo;
  const opts = document.createElement("div");
  opts.className = "mg-options";
  const begin = () => beginActionSim();
  opts.appendChild(mgButton("[ENTER] START SIM", begin));
  body.appendChild(mgStatus("HOW TO PLAY"));
  body.appendChild(how);
  body.appendChild(opts);
  m.keymap = { enterAct: begin };
}
function beginActionSim() {
  const m = G.mg;
  if (m.def.type === "timing") renderPatch();
  else if (m.def.type === "pong") renderPong();
  else if (m.def.type === "catch") renderCatch();
  else assert(false, "beginActionSim called for type '" + m.def.type + "'");
}

function mgButton(label, onClick) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "ctrl-btn";
  b.textContent = label;
  b.addEventListener("click", onClick);
  return b;
}
function mgStatus(text) {
  const s = document.createElement("div");
  s.className = "mg-status";
  s.textContent = text;
  return s;
}

function renderQuizItem() {
  const m = G.mg;
  const body = el("mg-body");
  body.innerHTML = "";
  const item = m.def.items[m.idx];
  const box = document.createElement("div");
  box.className = "mg-item";
  box.textContent = item.text;
  const opts = document.createElement("div");
  opts.className = "mg-options";
  const yes = () => answerQuiz(true), no = () => answerQuiz(false);
  opts.appendChild(mgButton("[1] " + m.def.yesLabel, yes));
  opts.appendChild(mgButton("[2] " + m.def.noLabel, no));
  body.appendChild(mgStatus("MESSAGE " + (m.idx + 1) + " / " + m.def.items.length + " · CORRECT " + m.right));
  body.appendChild(box);
  body.appendChild(opts);
  m.keymap = { "1": yes, "2": no };
}
function answerQuiz(saidPhish) {
  const m = G.mg;
  const item = m.def.items[m.idx];
  const good = saidPhish === item.phish;
  if (good) { m.right++; SFX.correct(); } else { SFX.wrong(); }
  mgFeedback(good, item.why, () => {
    m.idx++;
    if (m.idx < m.def.items.length) renderQuizItem();
    else finishMinigame(m.right * m.def.bonusPer, m.right + " / " + m.def.items.length + " correct.");
  });
}

function renderPickRound() {
  const m = G.mg;
  const body = el("mg-body");
  body.innerHTML = "";
  const round = m.def.rounds[m.idx];
  const opts = document.createElement("div");
  opts.className = "mg-options";
  m.keymap = {};
  round.options.forEach((opt, i) => {
    const act = () => {
      const good = i === round.correct;
      if (good) { m.right++; SFX.correct(); } else { SFX.wrong(); }
      mgFeedback(good, round.why, () => {
        m.idx++;
        if (m.idx < m.def.rounds.length) renderPickRound();
        else finishMinigame(m.right * m.def.bonusPer, m.right + " / " + m.def.rounds.length + " correct.");
      });
    };
    opts.appendChild(mgButton("[" + (i + 1) + "] " + opt, act));
    m.keymap[String(i + 1)] = act;
  });
  body.appendChild(mgStatus("SET " + (m.idx + 1) + " / " + m.def.rounds.length + " · CORRECT " + m.right));
  body.appendChild(opts);
}

/* ---- patch rush (timing, one-shot: first miss ends) ---- */
function renderPatch() {
  const m = G.mg;
  const body = el("mg-body");
  body.innerHTML = "";
  const status = mgStatus("");
  status.id = "patch-status";
  const bar = document.createElement("div");
  bar.id = "patch-bar";
  const zone = document.createElement("div");
  zone.id = "patch-zone";
  const marker = document.createElement("div");
  marker.id = "patch-marker";
  bar.appendChild(zone); bar.appendChild(marker);
  const opts = document.createElement("div");
  opts.className = "mg-options";
  opts.appendChild(mgButton("[SPACE] APPLY PATCH", patchAttempt));
  body.appendChild(status); body.appendChild(bar); body.appendChild(opts);

  m.patch = { pos: 0, dir: 1, speed: 3, width: 768, zoneW: 110, zoneX: 0, running: true };
  m.keymap = { " ": patchAttempt, "enterAct": patchAttempt };
  randomizePatchZone();
  updatePatchStatus();
  requestAnimationFrame(patchLoop);
}
function randomizePatchZone() {
  const p = G.mg.patch;
  p.zoneX = Math.floor(Math.random() * (p.width - p.zoneW));
  const zone = el("patch-zone");
  zone.style.left = p.zoneX + "px";
  zone.style.width = p.zoneW + "px";
}
function updatePatchStatus() {
  const m = G.mg;
  el("patch-status").textContent =
    "PATCHES " + "■".repeat(m.hits) + "□".repeat(m.def.hits - m.hits) + " · ONE MISS ENDS THE SIM";
}
function patchLoop() {
  if (G.mode !== "minigame" || !G.mg || !G.mg.patch || !G.mg.patch.running) return;
  const p = G.mg.patch;
  p.pos += p.dir * p.speed;
  if (p.pos <= 0) { p.pos = 0; p.dir = 1; }
  if (p.pos >= p.width - 6) { p.pos = p.width - 6; p.dir = -1; }
  el("patch-marker").style.left = Math.floor(p.pos) + "px";
  requestAnimationFrame(patchLoop);
}
function patchAttempt() {
  const m = G.mg;
  const p = m.patch;
  if (!p || !p.running) return;
  if (p.pos >= p.zoneX && p.pos + 6 <= p.zoneX + p.zoneW) {
    m.hits++;
    SFX.correct();
    if (m.hits >= m.def.hits) {
      p.running = false;
      finishMinigame(m.hits * m.def.bonusPerHit, "All " + m.def.hits + " patches landed. " + m.def.why);
      return;
    }
    p.speed += 0.5;
    randomizePatchZone();
    updatePatchStatus();
  } else {
    p.running = false;
    SFX.wrong();
    finishMinigame(m.hits * m.def.bonusPerHit,
      "Missed the window after " + m.hits + " clean patch" + (m.hits === 1 ? "" : "es") + ". " + m.def.why);
  }
}

/* ---- firewall pong (one-shot: one miss ends) ---- */
function renderPong() {
  const m = G.mg;
  const body = el("mg-body");
  body.innerHTML = "";
  const status = mgStatus("");
  status.id = "arcade-status";
  const field = document.createElement("div");
  field.id = "arcade-field";
  const paddle = document.createElement("div");
  paddle.id = "arcade-paddle";
  const ball = document.createElement("div");
  ball.id = "arcade-ball";
  field.appendChild(paddle); field.appendChild(ball);
  body.appendChild(status); body.appendChild(field);

  m.arcade = {
    kind: "pong", w: 768, h: 274,
    paddleX: 329, paddleW: 130,
    bx: 380, by: 40, vx: 1.5, vy: 1.5,
    running: true
  };
  m.keymap = {};
  updateArcadeStatus();
  requestAnimationFrame(arcadeLoop);
}
function pongStep() {
  const m = G.mg;
  const a = m.arcade;
  if (G.keys.has("a") || G.keys.has("arrowleft")) a.paddleX -= 5;
  if (G.keys.has("d") || G.keys.has("arrowright")) a.paddleX += 5;
  a.paddleX = Math.max(0, Math.min(a.w - a.paddleW, a.paddleX));
  a.bx += a.vx; a.by += a.vy;
  if (a.bx <= 0) { a.bx = 0; a.vx = Math.abs(a.vx); }
  if (a.bx >= a.w - 10) { a.bx = a.w - 10; a.vx = -Math.abs(a.vx); }
  if (a.by <= 0) { a.by = 0; a.vy = Math.abs(a.vy); }
  const paddleTop = a.h - 16;
  if (a.vy > 0 && a.by + 10 >= paddleTop && a.by + 10 <= paddleTop + 12 &&
      a.bx + 10 >= a.paddleX && a.bx <= a.paddleX + a.paddleW) {
    a.vy = -Math.abs(a.vy);
    const off = ((a.bx + 5) - (a.paddleX + a.paddleW / 2)) / (a.paddleW / 2);
    a.vx = Math.max(-3, Math.min(3, a.vx + off * 1.2));
    m.hits++;
    SFX.blip();
    a.vy -= 0.1;
    updateArcadeStatus();
    if (m.hits >= m.def.goal) {
      a.running = false;
      finishMinigame(m.hits * m.def.bonusPer, "All " + m.def.goal + " packets deflected. " + m.def.why);
      return;
    }
  }
  if (a.by > a.h) {
    a.running = false;
    SFX.wrong();
    finishMinigame(m.hits * m.def.bonusPer,
      "A packet got past after " + m.hits + " deflection" + (m.hits === 1 ? "" : "s") + ". " + m.def.why);
  }
}

/* ---- weight drop / catch (one-shot: one bad catch ends) ---- */
function renderCatch() {
  const m = G.mg;
  const body = el("mg-body");
  body.innerHTML = "";
  const status = mgStatus("");
  status.id = "arcade-status";
  const field = document.createElement("div");
  field.id = "arcade-field";
  const paddle = document.createElement("div");
  paddle.id = "arcade-paddle";
  field.appendChild(paddle);
  body.appendChild(status); body.appendChild(field);

  m.arcade = {
    kind: "catch", w: 768, h: 274,
    paddleX: 349, paddleW: 90,
    items: [], spawnIn: 30, tickCount: 0,
    running: true
  };
  m.keymap = {};
  updateArcadeStatus();
  requestAnimationFrame(arcadeLoop);
}
function catchStep() {
  const m = G.mg;
  const a = m.arcade;
  if (G.keys.has("a") || G.keys.has("arrowleft")) a.paddleX -= 5;
  if (G.keys.has("d") || G.keys.has("arrowright")) a.paddleX += 5;
  a.paddleX = Math.max(0, Math.min(a.w - a.paddleW, a.paddleX));
  a.tickCount++;
  a.spawnIn--;
  if (a.spawnIn <= 0) {
    a.spawnIn = Math.max(55, 80 - a.tickCount / 40);
    const node = document.createElement("div");
    const good = Math.random() < 0.65;
    node.className = "arcade-item " + (good ? "good" : "bad");
    el("arcade-field").appendChild(node);
    a.items.push({ x: Math.floor(Math.random() * (a.w - 14)), y: -14, vy: 1.1 + Math.random() * 0.7, good, node });
  }
  const paddleTop = a.h - 16;
  for (let i = a.items.length - 1; i >= 0; i--) {
    const it = a.items[i];
    it.y += it.vy;
    it.node.style.left = Math.floor(it.x) + "px";
    it.node.style.top = Math.floor(it.y) + "px";
    const caught = it.y + 14 >= paddleTop && it.y + 14 <= paddleTop + 14 &&
                   it.x + 14 >= a.paddleX && it.x <= a.paddleX + a.paddleW;
    if (caught) {
      it.node.remove();
      a.items.splice(i, 1);
      if (it.good) {
        m.hits++;
        SFX.blip();
        updateArcadeStatus();
        if (m.hits >= m.def.goal) {
          a.running = false;
          finishMinigame(m.hits * m.def.bonusPer, "All " + m.def.goal + " clean checkpoints secured. " + m.def.why);
          return;
        }
      } else {
        a.running = false;
        SFX.wrong();
        finishMinigame(m.hits * m.def.bonusPer,
          "Caught a poisoned batch after " + m.hits + " clean checkpoint" + (m.hits === 1 ? "" : "s") + ". " + m.def.why);
        return;
      }
    } else if (it.y > a.h) {
      it.node.remove();
      a.items.splice(i, 1);
    }
  }
}
function arcadeLoop() {
  if (G.mode !== "minigame" || !G.mg || !G.mg.arcade || !G.mg.arcade.running) return;
  const a = G.mg.arcade;
  if (a.kind === "pong") pongStep(); else catchStep();
  if (!G.mg || !G.mg.arcade || !G.mg.arcade.running) return;
  const paddle = el("arcade-paddle");
  paddle.style.left = Math.floor(a.paddleX) + "px";
  paddle.style.width = a.paddleW + "px";
  if (a.kind === "pong") {
    const ball = el("arcade-ball");
    ball.style.left = Math.floor(a.bx) + "px";
    ball.style.top = Math.floor(a.by) + "px";
  }
  requestAnimationFrame(arcadeLoop);
}
function updateArcadeStatus() {
  const m = G.mg;
  const label = m.arcade.kind === "pong" ? "DEFLECTED" : "SECURED";
  el("arcade-status").textContent = label + " " + m.hits + " / " + m.def.goal + " · ONE MISS ENDS THE SIM";
}

function mgFeedback(good, why, next) {
  const m = G.mg;
  const body = el("mg-body");
  body.innerHTML = "";
  const fb = document.createElement("div");
  fb.className = "mg-feedback";
  fb.innerHTML = (good ? '<b class="good">CORRECT.</b> ' : '<b class="bad">WRONG.</b> ');
  fb.appendChild(document.createTextNode(why));
  const opts = document.createElement("div");
  opts.className = "mg-options";
  opts.appendChild(mgButton(CONTENT.strings.mgContinue, next));
  body.appendChild(fb); body.appendChild(opts);
  m.keymap = { "enterAct": next };
}

function finishMinigame(bonus, summary) {
  const m = G.mg;
  const first = !gameCleared(m.ent);
  if (first) {
    G.progress.games[m.ent.key] = true;
    G.score.bonus += bonus;
    saveGame();
  }
  const body = el("mg-body");
  body.innerHTML = "";
  const fb = document.createElement("div");
  fb.className = "mg-feedback";
  fb.textContent = summary + (first ? " BONUS +" + bonus : " (replay — no bonus)");
  const opts = document.createElement("div");
  opts.className = "mg-options";
  opts.appendChild(mgButton(CONTENT.strings.mgFinish, closeMinigame));
  body.appendChild(fb); body.appendChild(opts);
  m.keymap = { "enterAct": closeMinigame };
}
function closeMinigame() {
  if (G.mg) {
    if (G.mg.patch) G.mg.patch.running = false;
    if (G.mg.arcade) G.mg.arcade.running = false;
  }
  G.mg = null;
  el("minigame").style.display = "none";
  G.mode = "world";
  G.keys.clear();
  updateHud();
}

/* =====================================================================
   BATTLE (regular + hacker duels)
   ===================================================================== */
let spriteURIs = [];
function sliceSprites() {
  spriteURIs = [];
  for (let i = 0; i < SHEET_TILES; i++) {
    const c = document.createElement("canvas");
    c.width = 16; c.height = 16;
    const x = c.getContext("2d");
    x.imageSmoothingEnabled = false;
    x.drawImage(G.sheet, i * 16, 0, 16, 16, 0, 0, 16, 16);
    spriteURIs.push(c.toDataURL("image/png"));
  }
}

function restartAnim(node, cls) {
  node.classList.remove(cls);
  void node.offsetWidth;
  node.classList.add(cls);
}

function controlLabel(cid) {
  const c = CONTENT.controls.find(c => c.id === cid);
  assert(c !== undefined, "unknown control id '" + cid + "'");
  return c.label;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function classifyPick(enemy, cid) {
  if (cid === enemy.correct) return "correct";
  if (enemy.plausible.includes(cid)) return "plausible";
  if (cid === enemy.wrong) return "wrong";
  assert(false, "picked control '" + cid + "' is not in enemy '" + enemy.id + "' matchup table");
}

function renderBars() {
  const b = G.battle;
  el("enemy-hp-inner").style.width = b.enemyHP + "%";
  el("enemy-hp-num").textContent = b.enemyHP;
  el("integrity-inner").style.width = b.integrity + "%";
  el("integrity-num").textContent = b.integrity;
  el("player-locks").innerHTML = locksMarkup();
}

function setupBattleScreen(displayName, spriteIdx) {
  const b = G.battle;
  b.enemyHP = 100;
  b.integrity = 100;
  b.phase = "pick";
  el("enemy-name").textContent = displayName;
  const img = el("enemy-sprite-img");
  img.classList.remove("faint", "hit");
  img.src = spriteURIs[spriteIdx];
  el("player-sprite-img").src = spriteURIs[G.character.tiles[1]];
  el("player-name").textContent = "SEC-ENGINEER // " + G.character.name;
  el("battle").style.display = "flex";
  el("overlay").style.display = "none";
  el("endscreen").style.display = "none";
  restartAnim(el("enemy-stage"), "enter-right");
  restartAnim(el("player-stage"), "enter-left");
  startMusic("battle");
  renderBars();
  nextTurn();
}

function startBattle(term) {
  assert(term !== null && term !== undefined, "startBattle called with no terminal");
  const b = G.battle;
  b.terminal = term;
  b.hacker = null;
  b.duel = false;
  b.enemy = term.enemy;
  setupBattleScreen(b.enemy.name, b.enemy.spriteIndex);
}

function startDuel(hackerEnt) {
  assert(hackerEnt !== null && hackerEnt !== undefined, "startDuel called with no hacker");
  const b = G.battle;
  const def = hackerEnt.def;
  b.terminal = null;
  b.hacker = hackerEnt;
  b.duel = true;
  b.enemy = CONTENT.enemies.find(e => e.id === def.challenge);
  assert(b.enemy !== undefined, "hacker challenges unknown enemy '" + def.challenge + "'");
  setupBattleScreen(def.name + " // " + b.enemy.name, NPC_TILES[def.sprite]);
}

function setButtonsEnabled(on) {
  for (const btn of el("controls").querySelectorAll("button")) btn.disabled = !on;
}

function nextTurn() {
  const b = G.battle;
  b.phase = "pick";
  // reshuffle the four options every turn
  b.order = shuffle([b.enemy.correct, b.enemy.plausible[0], b.enemy.plausible[1], b.enemy.wrong]);
  const grid = el("controls");
  grid.innerHTML = "";
  b.order.forEach((cid, i) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "ctrl-btn";
    btn.innerHTML = '<span class="key">[' + (i + 1) + ']</span> ' + controlLabel(cid);
    btn.addEventListener("click", () => pick(cid));
    grid.appendChild(btn);
  });
  const line = b.enemy.flavor[Math.floor(Math.random() * b.enemy.flavor.length)];
  const tag = b.duel ? CONTENT.strings.duelTag : CONTENT.strings.attackTag;
  el("msgbox").innerHTML =
    '<span class="msg-tag">' + tag + " // " + (b.duel ? b.hacker.def.name : b.enemy.name) + "</span><br>" + line;
  setButtonsEnabled(true);
}

function pick(cid) {
  const b = G.battle;
  if (b.phase !== "pick") return;
  b.phase = "anim";
  setButtonsEnabled(false);

  const kind = classifyPick(b.enemy, cid);
  G.score[kind]++;
  // duels are sudden death: correct one-shots them, anything else one-shots you
  const dmg = b.duel
    ? (kind === "correct" ? { toEnemy: 100, toPlayer: 0 } : { toEnemy: 0, toPlayer: 100 })
    : DMG[kind];
  b.enemyHP = Math.max(0, b.enemyHP - dmg.toEnemy);
  b.integrity = Math.max(0, b.integrity - dmg.toPlayer);
  renderBars();

  SFX[kind]();
  if (dmg.toEnemy > 0) restartAnim(el("enemy-sprite-img"), "hit");
  if (dmg.toPlayer > 0) restartAnim(el("arena"), "shake");

  const banner = el("result-banner");
  const fx = el("result-fx");
  if (kind === "correct") {
    banner.textContent = CONTENT.strings.resultCorrect; banner.style.color = "#3ddc84";
    fx.textContent = CONTENT.strings.fxSuper; fx.style.color = "#3ddc84";
  } else if (kind === "plausible") {
    banner.textContent = CONTENT.strings.resultPlausible; banner.style.color = "#ffd23f";
    fx.textContent = CONTENT.strings.fxPartial; fx.style.color = "#ffd23f";
  } else {
    banner.textContent = CONTENT.strings.resultWrong; banner.style.color = "#ff3860";
    fx.textContent = CONTENT.strings.fxNone; fx.style.color = "#ff3860";
  }

  const parts = [];
  if (dmg.toEnemy > 0) parts.push("THREAT -" + dmg.toEnemy + " HP");
  if (dmg.toPlayer > 0) parts.push("INTEGRITY -" + dmg.toPlayer);
  if (parts.length === 0) parts.push("NO EFFECT ON THREAT");
  el("result-dmg").textContent = controlLabel(cid).toUpperCase() + " — " + parts.join("  //  ");
  el("explainer-text").textContent = b.enemy.explainers[cid];

  setTimeout(() => {
    b.phase = "explain";
    el("overlay").style.display = "block";
  }, 600);
}

function continueFromExplainer() {
  const b = G.battle;
  if (b.phase !== "explain") return;
  el("overlay").style.display = "none";

  if (b.enemyHP <= 0) {
    b.phase = "faint";
    SFX.faint();
    el("enemy-sprite-img").classList.add("faint");
    setTimeout(() => {
      b.phase = "won";
      if (b.duel) {
        G.progress.hackers[b.hacker.key] = true;
        G.score.bonus += b.hacker.def.bonus;
        saveGame();
        showPanel(CONTENT.strings.duelWinTitle,
          b.hacker.def.winLine + " BONUS +" + b.hacker.def.bonus,
          CONTENT.strings.winBtn, "#3ddc84", afterWin);
      } else {
        G.progress.terminals[b.terminal.key] = true;
        saveGame();
        showPanel(CONTENT.strings.winTitle, CONTENT.strings.winBody, CONTENT.strings.winBtn, "#3ddc84", afterWin);
      }
    }, 700);
  } else if (b.integrity <= 0) {
    G.score.breaches++;
    G.lives--;
    assert(G.lives >= 0, "lives went negative: " + G.lives);
    saveGame();
    if (G.lives === 0) {
      b.phase = "defeated";
      showEndCard(CONTENT.strings.defeatTitle, CONTENT.strings.defeatBody, CONTENT.strings.defeatBtn, "#ff3860");
    } else if (b.duel) {
      b.phase = "lost";
      showPanel(CONTENT.strings.duelLoseTitle,
        b.hacker.def.loseLine + " " + CONTENT.strings.lockdownLabel + " REMAINING: " + G.lives,
        CONTENT.strings.duelWalkBtn, "#ff3860",
        () => { el("battle").style.display = "none"; returnToFloor(); });
    } else {
      b.phase = "lost";
      showPanel(CONTENT.strings.loseTitle,
        CONTENT.strings.loseBody + " " + CONTENT.strings.lockdownLabel + " REMAINING: " + G.lives,
        CONTENT.strings.loseBtn, "#ff3860",
        () => startBattle(b.terminal));
    }
  } else {
    nextTurn();
  }
}

function afterWin() {
  el("battle").style.display = "none";
  if (totalThreatsCleared() >= CONTENT.enemies.length) {
    showEndCard(CONTENT.strings.endTitle, CONTENT.strings.endBody, CONTENT.strings.endBtn, "#3ddc84");
  } else {
    returnToFloor();
  }
}

function returnToFloor() {
  el("world").style.display = "flex";
  G.mode = "unwipe";
  G.wipeFrames = 22;
  startMusic("world");
  updateHud();
}

/* =====================================================================
   PANELS / END CARDS / TITLE / CHARACTER SELECT
   ===================================================================== */
function showPanel(title, body, btnLabel, color, action) {
  el("end-title").textContent = title;
  el("end-title").style.color = color;
  el("end-body").textContent = body;
  el("end-table").style.display = "none";
  el("end-btn").textContent = btnLabel + " [ENTER]";
  el("endscreen").style.display = "block";
  G.panelAction = action;
}

function scoreSummary() {
  const s = G.score;
  const points = s.correct * 100 + s.plausible * 25 + s.bonus;
  return "SCORE: <b>" + points + "</b> (" + s.bonus + " bonus) &nbsp;&#183;&nbsp; " +
    s.correct + " correct / " + s.plausible + " partial / " + s.wrong + " wrong picks &nbsp;&#183;&nbsp; " +
    s.breaches + " breach" + (s.breaches === 1 ? "" : "es");
}

function showEndCard(title, body, btnLabel, color) {
  G.mode = "ended";
  deleteSave(); // run is over either way — next title visit starts fresh
  el("battle").style.display = "none";
  el("world").style.display = "none";
  el("dialog").style.display = "none";
  el("minigame").style.display = "none";
  el("end-title").textContent = title;
  el("end-title").style.color = color;
  el("end-body").innerHTML = scoreSummary() + "<br><br>" + body;

  const tbl = el("end-table");
  tbl.innerHTML = "";
  const head = document.createElement("tr");
  for (const h of CONTENT.strings.tableHead) {
    const th = document.createElement("th");
    th.textContent = h;
    head.appendChild(th);
  }
  tbl.appendChild(head);
  for (const e of CONTENT.enemies) {
    const tr = document.createElement("tr");
    const cells = [
      [e.name, ""],
      [controlLabel(e.correct), "cell-correct"],
      [e.plausible.map(controlLabel).join(" / "), "cell-plausible"],
      [controlLabel(e.wrong), "cell-wrong"]
    ];
    for (const [text, cls] of cells) {
      const td = document.createElement("td");
      td.textContent = text;
      if (cls) td.className = cls;
      tr.appendChild(td);
    }
    tbl.appendChild(tr);
  }
  tbl.style.display = "table";
  el("end-btn").textContent = btnLabel + " [ENTER]";
  el("endscreen").style.display = "block";
  G.panelAction = showTitle;
}

function panelButton() {
  assert(typeof G.panelAction === "function", "panel button clicked with no action set");
  const action = G.panelAction;
  G.panelAction = null;
  el("endscreen").style.display = "none";
  action();
}

function resetRun() {
  G.lives = CONTENT.rules.lives;
  G.score.correct = G.score.plausible = G.score.wrong = G.score.breaches = G.score.bonus = 0;
  G.progress = { terminals: {}, games: {}, hackers: {}, introShown: false };
  G.keys.clear();
  G.character = null;
  const start = startRoomAndPos();
  buildRoom(start.roomId);
  placePlayer(start.x, start.y, "down");
}

function showTitle() {
  G.mode = "title";
  resetRun();
  for (const id of ["world", "battle", "overlay", "endscreen", "charselect", "dialog", "minigame"]) {
    el(id).style.display = "none";
  }
  el("title").style.display = "block";
  el("title-start").textContent =
    loadSave() !== null ? CONTENT.strings.titleContinue : CONTENT.strings.titleStart;
  el("title-notice").textContent = storageNotice;
  if (audioCtx !== null) startMusic("world");
}

function startFromTitle() {
  if (G.mode !== "title") return;
  initAudio();
  SFX.start();
  startMusic("world");
  const save = loadSave();
  if (save !== null) {
    continueRun(save);
    return;
  }
  el("title").style.display = "none";
  el("charselect").style.display = "block";
  G.mode = "charselect";
}

function startNewRunFromTitle() {
  if (G.mode !== "title") return;
  deleteSave();
  initAudio();
  SFX.start();
  startMusic("world");
  el("title").style.display = "none";
  el("charselect").style.display = "block";
  G.mode = "charselect";
}

function continueRun(save) {
  const chr = CONTENT.characters.find(c => c.id === save.character);
  assert(chr !== undefined, "continueRun: character '" + save.character + "' vanished after validation");
  G.character = chr;
  G.lives = save.lives;
  G.score = save.score;
  G.progress = save.progress;
  buildRoom(save.roomId);
  assert(save.ty >= 0 && save.ty < G.room.h && save.tx >= 0 && save.tx < G.room.w,
    "continueRun: saved position " + save.tx + "," + save.ty + " outside room '" + save.roomId + "'");
  placePlayer(save.tx, save.ty, "down");
  el("title").style.display = "none";
  el("world").style.display = "flex";
  G.mode = "unwipe";
  G.wipeFrames = 22;
  updateHud();
}

function selectCharacter(idx) {
  if (G.mode !== "charselect") return;
  assert(idx >= 0 && idx < CONTENT.characters.length, "character index " + idx + " out of range");
  G.character = CONTENT.characters[idx];
  SFX.correct();
  el("charselect").style.display = "none";
  el("world").style.display = "flex";
  G.mode = "unwipe";
  G.wipeFrames = 22;
  updateHud();
  saveGame();
}

/* =====================================================================
   KEYBOARD — the whole game is playable without a mouse
   ===================================================================== */
function handleKeydown(e) {
  const key = e.key;
  const lower = key.toLowerCase();

  if (lower === "m") {
    G.muted = !G.muted;
    return;
  }
  // panels (win/lose/level/end cards)
  if (G.panelAction !== null && (key === "Enter" || key === " ")) {
    e.preventDefault();
    panelButton();
    return;
  }
  if (G.mode === "title") {
    if (key === "Enter" || key === " ") {
      e.preventDefault();
      startFromTitle();
    } else if (lower === "n") {
      e.preventDefault();
      startNewRunFromTitle();
    }
    return;
  }
  if (G.mode === "charselect") {
    const n = Number(key);
    if (Number.isInteger(n) && n >= 1 && n <= CONTENT.characters.length) {
      e.preventDefault();
      selectCharacter(n - 1);
    }
    return;
  }
  if (G.mode === "dialog" && (key === "Enter" || key === " ")) {
    e.preventDefault();
    advanceDialog();
    return;
  }
  if (G.mode === "battle") {
    const b = G.battle;
    if (b.phase === "pick") {
      const n = Number(key);
      if (Number.isInteger(n) && n >= 1 && n <= b.order.length) {
        e.preventDefault();
        pick(b.order[n - 1]);
      }
    } else if (b.phase === "explain" && (key === "Enter" || key === " ")) {
      e.preventDefault();
      continueFromExplainer();
    }
    return;
  }
  if (G.mode === "minigame") {
    e.preventDefault();
    if (key === "Escape") { closeMinigame(); return; }
    if (lower in KEYMAP) { G.keys.add(lower); }        // paddle movement
    const m = G.mg;
    if (!m) return;
    if ((key === "Enter" || key === " ") && m.keymap.enterAct) { m.keymap.enterAct(); return; }
    if (m.keymap[key]) { m.keymap[key](); return; }
    if (key === " " && m.keymap[" "]) { m.keymap[" "](); return; }
    return;
  }
  if (lower in KEYMAP) {
    e.preventDefault();
    if (G.mode === "world") {
      G.keys.add(lower);
      G.tapDir = KEYMAP[lower];
    }
  }
}

/* =====================================================================
   BOOT
   ===================================================================== */
validateContent();

const sheetImg = new Image();
sheetImg.onload = function () {
  assert(sheetImg.width === SHEET_TILES * 16 && sheetImg.height === 16,
    "spritesheet decoded to " + sheetImg.width + "x" + sheetImg.height +
    ", expected " + (SHEET_TILES * 16) + "x16");
  G.sheet = sheetImg;

  const canvas = el("screen");
  G.ctx = canvas.getContext("2d");
  G.ctx.imageSmoothingEnabled = false;

  sliceSprites();
  fitScale();

  el("title-sub").textContent = CONTENT.strings.titleSub;
  el("title-start").textContent = CONTENT.strings.titleStart;
  el("title-hint").textContent = CONTENT.strings.titleHint;
  const sigils = el("title-sigils");
  sigils.innerHTML = "";
  for (const e of CONTENT.enemies) {
    const img = document.createElement("img");
    img.src = spriteURIs[e.spriteIndex];
    img.alt = e.name;
    sigils.appendChild(img);
  }

  el("cs-title").textContent = CONTENT.strings.charTitle;
  el("cs-hint").textContent = CONTENT.strings.charHint;
  const cards = el("cs-cards");
  cards.innerHTML = "";
  CONTENT.characters.forEach((c, i) => {
    const card = document.createElement("div");
    card.className = "cs-card panel";
    const img = document.createElement("img");
    img.src = spriteURIs[c.tiles[0]];
    img.alt = c.name;
    const nm = document.createElement("div");
    nm.className = "cs-name";
    nm.textContent = c.name;
    const key = document.createElement("div");
    key.className = "cs-key";
    key.textContent = "[" + (i + 1) + "]";
    const tag = document.createElement("div");
    tag.className = "cs-tag";
    tag.textContent = c.tagline;
    card.appendChild(img); card.appendChild(nm); card.appendChild(key); card.appendChild(tag);
    card.addEventListener("click", () => selectCharacter(i));
    cards.appendChild(card);
  });

  window.addEventListener("resize", fitScale);
  window.addEventListener("keydown", handleKeydown);
  window.addEventListener("keyup", (e) => G.keys.delete(e.key.toLowerCase()));
  el("title").addEventListener("click", startFromTitle);
  el("dialog").addEventListener("click", advanceDialog);
  el("overlay").addEventListener("click", continueFromExplainer);
  el("end-btn").addEventListener("click", panelButton);
  el("mg-exit").addEventListener("click", closeMinigame);

  showTitle();
  requestAnimationFrame(tick);
};
sheetImg.onerror = function () {
  renderFatal("spritesheet data URI failed to decode");
  throw new Error("spritesheet data URI failed to decode");
};
sheetImg.src = "data:image/png;base64," + SHEET_B64;
</script>
</body>
