  --steel-soft: #e8eff6;
  --slate: #5b6673;
  --slate-soft: #eceff2;
  --warm: #8f8577;
  --warm-soft: #f1eee9;
  --emerald: #1f8458;
  --emerald-soft: #e6f3ec;
  --amber: #b4781f;
  --amber-soft: #f8efe0;
  --sec: #4a4e9e;
  --sec-soft: #ecedf7;
  --sec-line: #c9cbe6;
  --font: "Inter", "SF Pro Text", -apple-system, "Segoe UI", system-ui, sans-serif;
  --ease: cubic-bezier(.2, .7, .2, 1);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-feature-settings: "cv11", "ss01";
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* ---- stage ---------------------------------------------------------------- */
.stage {
  position: absolute; left: 50%; top: 50%;
  width: 1920px; height: 1080px; overflow: hidden;
  transform: translate(-50%, -50%);
  transform-origin: center;
  opacity: 0; transition: opacity .5s var(--ease);
}
body.ready .stage { opacity: 1; }
.slides, .slide { width: 100%; height: 100%; }
.slide {
  position: absolute; inset: 0;
  padding: 18px 32px 18px;
  display: grid;
  grid-template-rows: 62px 1fr 60px;
  grid-template-columns: 1fr;
  opacity: 0; visibility: hidden; pointer-events: none;
  transition: opacity .55s var(--ease), transform .55s var(--ease), visibility 0s linear .55s;
}
.slide.is-before { transform: translateX(-48px); }
.slide.is-after  { transform: translateX(48px); }
.slide.is-active { opacity: 1; visibility: visible; pointer-events: auto; transform: none; transition-delay: 0s; }

/* ---- typography helpers --------------------------------------------------- */
.eyebrow {
  display: inline-flex; align-items: center; gap: 10px;
  font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3);
}
.eyebrow-dash { width: 18px; height: 2px; background: var(--accent); border-radius: 1px; }

/* ---- header ---------------------------------------------------------------- */
.hdr {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: end;
  padding-bottom: 14px; border-bottom: 1px solid var(--line);
}
.hdr-brand { display: flex; align-items: center; gap: 14px; padding-bottom: 4px; }
.brand-logo { height: 22px; width: auto; display: block; }
.brand-sep { width: 1px; height: 18px; background: var(--line); }
.brand-text { font-size: 13px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.hdr-title { text-align: center; }
.hdr-title h1 { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -.015em; line-height: 1.1; }
.hdr-title p  { margin: 4px 0 0; font-size: 14px; font-weight: 500; letter-spacing: .02em; color: var(--ink-3); }
.hdr-meta { display: flex; justify-content: flex-end; align-items: baseline; gap: 12px; padding-bottom: 4px; }
.meta-label { font-size: 12px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.page-num { font-size: 16px; font-weight: 500; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.page-num b { font-weight: 600; color: var(--ink); }
.page-num i { font-style: normal; margin: 0 5px; color: var(--ink-4); }

/* ---- problem band ----------------------------------------------------------- */
.problem {
  display: grid; grid-template-columns: 840px 1fr; column-gap: 56px; align-items: center;
  padding: 18px 0 14px; border-bottom: 1px solid var(--line);
}
.problem-lead .statement {
  margin: 8px 0 0; font-size: 26px; line-height: 1.25; font-weight: 500; letter-spacing: -.012em; color: var(--ink);
  text-wrap: balance;
}
.problem-lead .direction { margin: 8px 0 0; font-size: 13px; line-height: 1.4; color: var(--ink-3); }
.issues { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); column-gap: 24px; }
.issue { display: grid; grid-template-columns: auto 1fr; column-gap: 14px; align-items: start; padding-left: 20px; border-left: 1px solid var(--line); }
.issue-num { font-size: 13px; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; padding-top: 3px; letter-spacing: .04em; }
.issue h3 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.005em; line-height: 1.3; }
.issue p  { margin: 5px 0 0; font-size: 13px; line-height: 1.45; color: var(--ink-2); }

/* ---- architecture ---------------------------------------------------------- */
.arch-wrap { display: grid; grid-template-rows: 26px 1fr; min-height: 0; }
.arch-head { display: flex; align-items: center; justify-content: space-between; padding-top: 8px; }
.arch-flow { font-size: 12px; font-weight: 500; letter-spacing: .02em; color: var(--ink-3); }
.arch-flow i { font-style: normal; color: var(--ink-4); margin: 0 8px; }
.arch-canvas { position: relative; width: 1856px; height: 100%; min-height: 0; }
.arch { display: block; width: 100%; height: 100%; overflow: visible; font-family: var(--font); }

/* lanes */
.lane rect { fill: var(--lane); stroke: var(--line-soft); stroke-width: 1; transition: fill .4s var(--ease), stroke .4s var(--ease); }
.lane.active rect { fill: #ffffff; stroke: #d2d5da; }
.lane-num { font-size: 13px; font-weight: 700; fill: var(--accent); letter-spacing: .06em; text-transform: none; }
.lane-title { font-size: 13px; font-weight: 600; fill: var(--ink-2); letter-spacing: .1em; text-transform: uppercase; }
.lane-rule { stroke: var(--line-soft); stroke-width: 1; }
.lane-desc { font-size: 11.5px; font-weight: 400; fill: var(--ink-3); }
.lane.active .lane-title { fill: var(--ink); }

/* nodes */
.node { cursor: pointer; outline: none; transition: opacity .45s var(--ease); }
.node-body { transform-box: fill-box; transform-origin: center; transition: transform .45s var(--ease); }
.node-bg { fill: var(--surface); stroke: #d7dade; stroke-width: 1; filter: url(#node-shadow); transition: stroke .35s var(--ease); }
.node-ring { fill: none; stroke: var(--accent); stroke-width: 1.5; opacity: 0; transition: opacity .35s var(--ease); }
.node.kind-agent .node-bg { stroke: #c9cfd6; }
.node.kind-external .node-bg { stroke-dasharray: 5 4; stroke: #c4bdb3; }
.node.kind-external.active .node-bg { stroke-dasharray: none; stroke: var(--steel); }
.agent-dot { fill: var(--slate); opacity: .7; }
.chip-bg { fill: var(--slate-soft); transition: fill .35s var(--ease); }
.ico { stroke: var(--slate); transition: stroke .35s var(--ease); }
.kind-external .chip-bg { fill: var(--warm-soft); } .kind-external .ico { stroke: var(--warm); }
.kind-data .chip-bg,
.kind-infra .chip-bg,
.kind-input .chip-bg { fill: var(--steel-soft); }
.kind-data .ico, .kind-infra .ico, .kind-input .ico { stroke: var(--steel); }
.kind-human .chip-bg { fill: var(--accent-soft); } .kind-human .ico { stroke: var(--accent); }
.kind-ok .chip-bg { fill: var(--emerald-soft); } .kind-ok .ico { stroke: var(--emerald); }
.kind-deny .chip-bg { fill: var(--amber-soft); } .kind-deny .ico { stroke: var(--amber); }
.node-eyebrow { font-size: 10px; font-weight: 600; fill: var(--ink-3); letter-spacing: .08em; text-transform: uppercase; }
.node-title { font-size: 15px; font-weight: 600; fill: var(--ink); letter-spacing: -.005em; }
.node.kind-ok .node-eyebrow { fill: var(--emerald); }
.node.kind-deny .node-eyebrow { fill: var(--amber); }
.node.kind-human .node-eyebrow { fill: var(--accent); }

/* node states while tracing */
.arch.playing .node { opacity: .38; }
.arch.playing .node.visited, .arch.playing .node.alt { opacity: 1; }
.arch.playing .node.active { opacity: 1; }
.arch.playing .node.active .node-body { transform: scale(1.04); }
.node.active .node-bg { stroke: var(--ink); filter: url(#node-shadow-active); }
.node.active .node-ring { opacity: 1; }
.node.kind-ok.active .node-ring { stroke: var(--emerald); }
.node.kind-deny.active .node-ring { stroke: var(--amber); }
.node.kind-human.active .node-ring { stroke: var(--accent); }
.node.kind-agent.active .node-ring { stroke: var(--ink); }
.node.kind-external.active .node-ring, .node.kind-data.active .node-ring, .node.kind-input.active .node-ring, .node.kind-infra.active .node-ring { stroke: var(--steel); }
.node.active .chip-bg { fill: var(--ink); } .node.active .ico { stroke: #fff; }
.node.kind-ok.active .chip-bg { fill: var(--emerald); }
.node.kind-deny.active .chip-bg { fill: var(--amber); }
.node.kind-human.active .chip-bg { fill: var(--accent); }
.node.visited .node-bg { stroke: #b9bec6; }
.node.alt .node-bg { stroke-dasharray: 4 3; }
.node.kind-ok.alt .node-bg { stroke: var(--emerald); }
.node.kind-deny.alt .node-bg { stroke: var(--amber); }
.node.pinned .node-ring { opacity: 1; stroke: var(--steel); }

/* hover-relationship focus */
.arch.focus .node:not(.related) { opacity: .25; }
.arch.focus .edge:not(.related) { opacity: .18; }
.arch.focus .edge.related .edge-base { stroke-width: 2; }
.arch.focus .edge.related.edge-flow .edge-base { stroke: var(--ink); }
.arch.focus .edge.related.edge-integration .edge-base, .arch.focus .edge.related.edge-enrich .edge-base { stroke: var(--steel); }
.arch.focus .edge.related.edge-human .edge-base { stroke: var(--accent); }
.arch.focus .edge.related.edge-ok .edge-base { stroke: var(--emerald); }
.arch.focus .edge.related.edge-deny .edge-base { stroke: var(--amber); }
.arch.focus .edge.related.edge-feedback .edge-base { stroke: var(--warm); }
.arch.focus .edge.related.edge-flow .edge-base { marker-end: url(#m-flow-hi); }
.arch.focus .edge.related.edge-integration .edge-base { marker-end: url(#m-integration-hi); }
.arch.focus .edge.related.edge-integration.bi .edge-base { marker-start: url(#m-integration-hi-rev); }
.arch.focus .edge.related.edge-enrich .edge-base { marker-end: url(#m-enrich-hi); }
.arch.focus .edge.related.edge-human .edge-base { marker-end: url(#m-human-hi); }
.arch.focus .edge.related.edge-human.bi .edge-base { marker-start: url(#m-human-hi-rev); }
.arch.focus .edge.related.edge-ok .edge-base { marker-end: url(#m-ok-hi); }
.arch.focus .edge.related.edge-deny .edge-base { marker-end: url(#m-deny-hi); }
.arch.focus .edge.related.edge-feedback .edge-base { marker-end: url(#m-feedback-hi); }

/* edges */
.edge { transition: opacity .45s var(--ease); }
.edge-base { fill: none; stroke-width: 1.5; stroke-linecap: round; transition: stroke .3s var(--ease), stroke-width .3s var(--ease); }
.edge-hi { fill: none; stroke-width: 2.25; stroke-linecap: round; opacity: 0; }
.edge.tracing .edge-hi, .edge.traced .edge-hi { opacity: 1; }
.edge.alt .edge-hi { stroke-dasharray: 5 4 !important; stroke-dashoffset: 0 !important; }
.signal { opacity: 0; }
.arch.playing .edge:not(.traced):not(.tracing) { opacity: .4; }

.edge-flow .edge-base { stroke: #a9aeb6; marker-end: url(#m-flow); }
.edge-flow .edge-hi { stroke: var(--ink); } .edge-flow .signal { fill: var(--ink); }
.edge-integration .edge-base { stroke: #9fb8d0; marker-end: url(#m-integration); }
.edge-integration.bi .edge-base { marker-start: url(#m-integration-rev); }
.edge-integration .edge-hi { stroke: var(--steel); } .edge-integration .signal { fill: var(--steel); }
.edge-enrich .edge-base { stroke: #9fb8d0; stroke-dasharray: 2 5; stroke-width: 2; marker-end: url(#m-enrich); }
.edge-enrich .edge-hi { stroke: var(--steel); stroke-dasharray: 2 5; } .edge-enrich .signal { fill: var(--steel); }
.edge-human .edge-base { stroke: #e3a3a8; stroke-dasharray: 6 4; marker-end: url(#m-human); }
.edge-human.bi .edge-base { marker-start: url(#m-human-rev); }
.edge-human .edge-hi { stroke: var(--accent); } .edge-human .signal { fill: var(--accent); }
.edge-ok .edge-base { stroke: #a3cdb7; marker-end: url(#m-ok); }
.edge-ok .edge-hi { stroke: var(--emerald); } .edge-ok .signal { fill: var(--emerald); }
.edge-deny .edge-base { stroke: #dcc08f; marker-end: url(#m-deny); }
.edge-deny .edge-hi { stroke: var(--amber); } .edge-deny .signal { fill: var(--amber); }
.edge-feedback .edge-base { stroke: #c6bdb2; stroke-dasharray: 9 6; marker-end: url(#m-feedback); }
.edge-feedback .edge-hi { stroke: var(--warm); } .edge-feedback .signal { fill: var(--warm); }

/* highlight arrowheads appear once the path has fully drawn */
.edge-flow .edge-hi.drawn { marker-end: url(#m-flow-hi); }
.edge-integration .edge-hi.drawn { marker-end: url(#m-integration-hi); }
.edge-integration.bi .edge-hi.drawn { marker-start: url(#m-integration-hi-rev); }
.edge-enrich .edge-hi.drawn { marker-end: url(#m-enrich-hi); }
.edge-human .edge-hi.drawn { marker-end: url(#m-human-hi); }
.edge-human.bi .edge-hi.drawn { marker-start: url(#m-human-hi-rev); }
.edge-ok .edge-hi.drawn { marker-end: url(#m-ok-hi); }
.edge-deny .edge-hi.drawn { marker-end: url(#m-deny-hi); }
.edge-feedback .edge-hi.drawn { marker-end: url(#m-feedback-hi); }

/* markers */
.mk path { stroke: none; }
.mk-flow path { fill: #a9aeb6; } .mk-flow-hi path { fill: var(--ink); }
.mk-integration path { fill: #9fb8d0; } .mk-integration-hi path { fill: var(--steel); }
.mk-enrich path { fill: #9fb8d0; } .mk-enrich-hi path { fill: var(--steel); }
.mk-human path { fill: #e3a3a8; } .mk-human-hi path { fill: var(--accent); }
.mk-ok path { fill: #a3cdb7; } .mk-ok-hi path { fill: var(--emerald); }
.mk-deny path { fill: #dcc08f; } .mk-deny-hi path { fill: var(--amber); }
.mk-feedback path { fill: #c6bdb2; } .mk-feedback-hi path { fill: var(--warm); }

/* labels & annotations */
.edge-label { font-size: 11px; font-weight: 500; fill: var(--ink-3); letter-spacing: .01em; paint-order: stroke; stroke: var(--lane); stroke-width: 5px; stroke-linejoin: round; }
.edge.traced .edge-label, .edge.tracing .edge-label { fill: var(--ink-2); }
.annot-either rect { fill: #fff; stroke: var(--line); }
.annot-text { font-size: 10.5px; font-weight: 600; fill: var(--ink-3); letter-spacing: .08em; text-transform: uppercase; }
.legend-title { font-size: 10.5px; font-weight: 600; fill: var(--ink-3); letter-spacing: .1em; text-transform: uppercase; }
.legend-text { font-size: 11.5px; font-weight: 500; fill: var(--ink-2); }
.legend-line { stroke-width: 1.75; }
.arch.playing .legend .edge:not(.traced) { opacity: 1; }

/* ---- control bar ----------------------------------------------------------- */
.bar {
  display: grid; grid-template-columns: auto auto 1fr auto; align-items: center; column-gap: 28px;
  margin-top: 6px; padding: 0 6px 0 2px; height: 60px;
  border-top: 1px solid var(--line);
}
.bar-stages { display: flex; gap: 6px; }
.stage-pill {
  display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px 0 10px;
  border: 1px solid transparent; border-radius: 15px; background: transparent; color: var(--ink-3);
  font: inherit; font-size: 11.5px; font-weight: 500; letter-spacing: .02em; cursor: pointer;
  transition: all .3s var(--ease);
}
.stage-pill b { font-weight: 700; font-size: 11px; color: var(--ink-4); letter-spacing: .04em; }
.stage-pill:hover { background: #ececea; color: var(--ink); }
.stage-pill.done { color: var(--ink-2); } .stage-pill.done b { color: var(--ink-2); }
.stage-pill.active { background: var(--ink); color: #fff; border-color: var(--ink); }
.stage-pill.active b { color: #ff8a90; }

.bar-controls { display: flex; align-items: center; gap: 6px; }
.ctl {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 38px; min-width: 38px; padding: 0 10px; border-radius: 19px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
  transition: all .25s var(--ease);
}
.ctl:hover { border-color: #b9bec6; }
.ctl:active { transform: translateY(1px); }
.ctl:disabled { opacity: .35; cursor: default; }
.ctl-sm { height: 34px; min-width: 34px; padding: 0 8px; }
.ctl-gap { width: 6px; }
.ui-ico { width: 18px; height: 18px; }
.ctl-play { background: var(--accent); border-color: var(--accent); color: #fff; padding: 0 18px 0 14px; }
.ctl-play:hover { background: #c01e27; border-color: #c01e27; }
.bar.is-playing .ctl-play { background: var(--ink); border-color: var(--ink); }

.bar-caption { min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 2px; border-left: 1px solid var(--line); padding-left: 24px; height: 52px; }
.cap-head { display: flex; align-items: baseline; gap: 12px; }
.cap-step { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); font-variant-numeric: tabular-nums; }
.cap-title { font-size: 14px; font-weight: 600; color: var(--ink); }
.cap-text { margin: 0; font-size: 13px; line-height: 1.3; color: var(--ink-2); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.bar-tools { display: flex; gap: 6px; }

/* ---- inspector popover ------------------------------------------------------- */
.inspector {
  position: absolute; z-index: 5; width: 360px; padding: 16px 18px 14px;
  background: #fff; border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 18px 40px rgba(27, 30, 35, .14), 0 2px 6px rgba(27, 30, 35, .06);
  pointer-events: none;
  animation: pop-in .22s var(--ease);
}
@keyframes pop-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.inspector::before {
  content: ""; position: absolute; left: var(--arrow-x, 50%); top: -7px; width: 12px; height: 12px; margin-left: -6px;
  background: #fff; border-left: 1px solid var(--line); border-top: 1px solid var(--line); transform: rotate(45deg);
}
.inspector.above::before { top: auto; bottom: -7px; transform: rotate(225deg); }
.insp-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.insp-kind { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--slate); padding: 3px 8px; border-radius: 4px; background: var(--slate-soft); }
.insp-kind.kind-external { color: var(--warm); background: var(--warm-soft); }
.insp-kind.kind-data, .insp-kind.kind-input, .insp-kind.kind-infra { color: var(--steel); background: var(--steel-soft); }
.insp-kind.kind-human { color: var(--accent); background: var(--accent-soft); }
.insp-kind.kind-ok { color: var(--emerald); background: var(--emerald-soft); }
.insp-kind.kind-deny { color: var(--amber); background: var(--amber-soft); }
.insp-stage { font-size: 11px; font-weight: 500; color: var(--ink-3); letter-spacing: .02em; }
.inspector h3 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
.inspector p { margin: 6px 0 0; font-size: 13px; line-height: 1.5; color: var(--ink-2); }
.insp-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line-soft); }
.insp-cols h4 { margin: 0 0 6px; font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.insp-cols ul { list-style: none; margin: 0; padding: 0; }
.insp-cols li { font-size: 12.5px; font-weight: 500; color: var(--ink); display: flex; align-items: center; gap: 8px; padding: 2px 0; }
.insp-cols li.none { color: var(--ink-4); }
.insp-cols li small { color: var(--steel); font-size: 12px; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--ink); }
.dot-integration, .dot-enrich { background: var(--steel); }
.dot-human { background: var(--accent); }
.dot-ok { background: var(--emerald); }
.dot-deny { background: var(--amber); }
.dot-feedback { background: var(--warm); }

/* ---- help overlay ------------------------------------------------------------ */
.help { position: absolute; inset: 0; z-index: 10; background: rgba(244, 244, 242, .72); display: flex; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
.help-card { width: 460px; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 22px 26px 20px; box-shadow: 0 24px 60px rgba(27, 30, 35, .18); }
.help-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.help-head h2 { margin: 0; font-size: 18px; font-weight: 600; }
.help dl { display: grid; grid-template-columns: 120px 1fr; row-gap: 8px; column-gap: 16px; margin: 0; font-size: 13.5px; }
.help dt { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.help dd { margin: 0; color: var(--ink-2); }
.help-toggle { display: flex; align-items: center; gap: 10px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line-soft); font-size: 13.5px; font-weight: 500; }
.help-toggle small { color: var(--ink-3); font-weight: 400; }

/* ---- reduced motion ---------------------------------------------------------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
}
html.reduced-motion *, html.reduced-motion *::before, html.reduced-motion *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
html.reduced-motion .arch.playing .node.active .node-body { transform: none; }

.empty { padding: 40px; color: var(--ink-3); }

/* hidden attribute must win over display rules */
[hidden] { display: none !important; }

/* ============================================================================
   Multi-page additions: header nav, cover, workflow, Project 02 node kinds
   ========================================================================== */
.brand-logo { height: 22px; width: auto; display: block; }
.hdr-meta { gap: 10px; align-items: center; }
.nav-btn { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); cursor: pointer; padding: 0; transition: all .25s var(--ease); }

      const tl = new Timeline();
      const dur = L => Math.min(1.5, Math.max(0.55, L * 0.0038)) * speed;
      const arrival = {}, startAt = {};   // edge id -> signal departure / arrival times

      const traceEdge = (id, start, alt) => {
        const E = arch.edges[id];
        const d = dur(E.length);
        startAt[id] = start;
        tl.call(start, () => { arch.resetEdge(id); E.g.classList.add('tracing'); E.dot.style.opacity = 1; });

          const gap = 0.12 * speed;
          tl.call(end + gap, () => { E.dot2.style.opacity = 1; });

      const groups = step.edges || [];

        groups.forEach(grp => {

          ids.forEach(id => { end = Math.max(end, traceEdge(id, t, false)); });

        if (step.alt) {
          /* mutually exclusive outcomes: trace A, settle it as an alternative, then trace B */
          const [a, b] = step.alt;
          const target = id => arch.edges[id].def.to;
          let end = traceEdge(a, t, true);
          activate([target(a)], end);
          end += 0.75 * speed;
          tl.call(end, () => arch.setNodeState(target(a), 'alt'));
          let end2 = traceEdge(b, end + 0.1 * speed, true);
          activate([target(b)], end2);

          tl.call(end2, () => { arch.setNodeState(target(b), 'alt'); arch.setNodeState(target(a), 'alt'); });
          t = end2 + 0.05;

          (step.nodes || []).forEach(id => {
            const inbound = groups.flat().filter(eid => {
              const d = arch.edges[eid].def;
              return d.to === id || (d.bidirectional && d.from === id);
            });
            if (!inbound.length) {
              /* a node that only sends in this step (e.g. a security technology) lights as its signal departs */
              const outbound = groups.flat().filter(eid => arch.edges[eid].def.from === id);

    const tileNote = t => t.kind === 'money' && missingOf(t).length ? `enter ${missingOf(t).map(k => SV.inputs.find(i => i.id === k).short).join(' & ')} to see this` : t.note;

        ${B.support ? `<p class="cover-support rise">${B.support}</p>` : ''}

        <ol class="issues cover-issues cols-3 bn-issues">
          ${B.items.map((it, i) => `<li class="issue rise"><span class="issue-num">${pad2(i + 1)}</span><div class="issue-body"><h3>${it.title}</h3><p>${it.text}</p><dl class="bn-facts"><div><dt>${B.measureLabel || 'Measured by'}</dt><dd>${it.measure}</dd></div><div><dt>${B.leverLabel || 'In the team’s hands'}</dt><dd>${it.lever}</dd></div></dl></div></li>`).join('')}
